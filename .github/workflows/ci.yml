name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.14 / HA 2026.9.3
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out integration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: homeostatic
          persist-credentials: false
      - name: Check out reviewed library baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mjcumming/health-tree
          ref: a525938c2d866956a4cefab8261da39d96347de1
          path: health-tree
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14"
          enable-cache: true
          working-directory: homeostatic
      - name: Install locked environment
        working-directory: homeostatic
        run: uv sync --locked
      - name: Required checks
        working-directory: homeostatic
        run: uv run python script/check.py
  hassfest:
    name: Home Assistant metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate integration
        uses: home-assistant/actions/hassfest@58bff37c8947f690ace498be413a9b78d6f30f93
