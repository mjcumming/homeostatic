blueprint:
  name: Homeostatic Companion notifications
  description: >-
    Route Homeostatic delivery requests to a Companion app notification action.
    Homeostatic owns policy and timing; this automation owns phone delivery.
    Set this automation as the consumer in Homeostatic options before activation.
    Tags replace previous messages. Receipt and critical sound require a real
    device test; an event is only a delivery request.
  domain: automation
  homeassistant:
    min_version: 2026.9.0
  input:
    recipient:
      name: Recipient id
      default: owner
      selector:
        text:
    channel:
      name: Channel id
      description: Match one opaque channel from the recipient's policy configuration.
      default: event
      selector:
        text:
    notify_service:
      name: Companion app notification action
      description: For example notify.mobile_app_your_phone.
      selector:
        text:
mode: queued
max: 100
variables:
  notify_service: !input notify_service
  channel: !input channel
triggers:
  - trigger: event
    event_type: homeostatic_notification
    event_data:
      schema_version: 1
      recipient: !input recipient
conditions:
  - condition: template
    value_template: "{{ channel in trigger.event.data.get('channels', ['event']) }}"
actions:
  - variables:
      notification_url: >-
        {% if trigger.event.data.get('details_url', '').startswith('/homeostatic/') %}
          {{ trigger.event.data.details_url }}
        {% elif 'episodes' in trigger.event.data %}
          {% set members = trigger.event.data.episodes | select('string') | reject('equalto', '') | unique(case_sensitive=true) | list %}
          {% if members | length == 1 %}
            {{ '/homeostatic/episode/' ~ (members[0] | urlencode | replace('/', '%2F')) }}
          {% else %}
            {% set encoded = namespace(ids=[]) %}
            {% for member in members %}
              {% set encoded.ids = encoded.ids + [member | urlencode | replace('/', '%2F')] %}
            {% endfor %}
            {{ '/homeostatic/issues/notification/' ~ (encoded.ids | join(',')) }}
          {% endif %}
        {% else %}
          {{ '/homeostatic/issues'
             if trigger.event.data.action in ['summary', 'digest']
             else '/homeostatic/episode/' ~ (trigger.event.data.episode_id | urlencode | replace('/', '%2F')) }}
        {% endif %}
      notification_tag: >-
        {{ trigger.event.data.tag | sha256
           if trigger.event.data.tag.encode("utf-8") | length > 64
           else trigger.event.data.tag }}
  - choose:
      - conditions: "{{ trigger.event.data.action == 'resolve' }}"
        sequence:
          - action: "{{ notify_service }}"
            data:
              message: clear_notification
              data:
                tag: "{{ notification_tag }}"
    default:
      - action: "{{ notify_service }}"
        data:
          title: "{{ trigger.event.data.title }}"
          message: "{{ trigger.event.data.message }}"
          data:
            tag: "{{ notification_tag }}"
            url: "{{ notification_url }}"
            clickAction: "{{ notification_url }}"
            alert_once: "{{ trigger.event.data.silent }}"
            push:
              sound:
                name: "{{ 'none' if trigger.event.data.silent else 'default' }}"
                critical: "{{ 1 if trigger.event.data.loudness == 'urgent' and not trigger.event.data.silent else 0 }}"
                volume: "{{ 0 if trigger.event.data.silent else 1 }}"
