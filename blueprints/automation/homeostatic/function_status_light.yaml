blueprint:
  name: Homeostatic function status light
  description: >-
    Turn a light on in a warning color while a Homeostatic function is not
    ready, and off when it is ready again. Uses the function's readiness
    sensor, so it follows every problem affecting the function and survives
    restarts. An example of acting on detected facts without notifications.
  domain: automation
  homeassistant:
    min_version: 2026.9.0
  input:
    function:
      name: Function readiness
      description: The Homeostatic readiness sensor of one function.
      selector:
        entity:
          filter:
            - integration: homeostatic
              domain: sensor
    light:
      name: Light
      selector:
        entity:
          filter:
            - domain: light
    color:
      name: Warning color
      default: [255, 80, 0]
      selector:
        color_rgb:
mode: restart
triggers:
  - trigger: state
    entity_id: !input function
conditions:
  - condition: template
    value_template: >-
      {{ trigger.to_state is not none
         and trigger.to_state.state not in ["unavailable", "unknown"] }}
actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state.state == 'ready' }}"
        sequence:
          - action: light.turn_off
            target:
              entity_id: !input light
    default:
      - action: light.turn_on
        target:
          entity_id: !input light
        data:
          rgb_color: !input color
