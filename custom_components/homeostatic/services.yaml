inventory:
  name: Inventory
  description: List monitored node identities, current episodes, and evidence limitations.
explain:
  name: Explain
  description: Explain a capability and its failing or unknown dependencies.
  fields:
    node_id:
      required: true
      example: "entry:01K00000000000000000000000"
      selector:
        text:
readiness:
  name: Readiness
  description: Return ready, unknown, degraded, or blocked for selected capabilities.
  fields:
    node_ids:
      description: Omit to use the monitor's selected capabilities.
      selector:
        object:
impact:
  name: Impact
  description: List the capabilities that depend on a node.
  fields:
    node_id:
      required: true
      selector:
        text:
coverage:
  name: Coverage
  description: List unwatched nodes, never-observed checks, and stale checks.
rollup:
  name: Rollup
  description: Count selected nodes by observed status and episode membership.
  fields:
    node_ids:
      selector:
        object:
preview_rules:
  name: Preview rules
  description: Show candidate rule matches and resulting availability checks without saving or sending notifications.
  fields:
    rules:
      required: true
      description: A list of attach or exclude catalog rules. Entity names are resolved to stable references for this preview.
      selector:
        object:
functions:
  name: Functions
  description: Explain requirements, missing evidence and scoped automation suggestions for each function.
preview_functions:
  name: Preview functions
  description: Preview unsaved function requirements using current evidence without history, saving, or notification delivery.
  fields:
    functions:
      required: true
      description: Replacement function definitions with requirements and candidate decisions.
      selector:
        object:
    external_capabilities:
      description: Replacement external capability declarations. Omit to retain current declarations.
      selector:
        object:
    rules:
      description: Optional replacement catalog rules for this preview only.
      selector:
        object:
policy:
  name: Notification policy
  description: Explain the last evaluated attention decision and pending delivery times for each current episode.
preview_policy:
  name: Preview notification policy
  description: Simulate activation of an unsaved policy against current episodes without saving or delivering requests.
  fields:
    policy:
      required: true
      description: Replacement policy mapping containing timezone, recipients, digests and rules.
      selector:
        object:
operator_controls:
  name: Operator controls
  description: List active shelves and equipment maintenance with their scope, expiry and requested reason.
shelve:
  name: Shelve problem
  description: Hold new alerts for one current problem across all recipients until a time, without changing its health. Requires administrator access.
  fields:
    episode_id:
      required: true
      description: A current episode id from Inventory. Summary tags are not episode ids.
      selector:
        text:
    until:
      required: true
      description: Explicit ISO timestamp with timezone, in the future and at most seven days away.
      example: "2026-09-25T22:00:00Z"
      selector:
        text:
    reason:
      description: Optional explanation, at most 500 characters.
      selector:
        text:
start_maintenance:
  name: Start equipment maintenance
  description: Prevent new problems in the selected equipment scope until a time. Existing alerts and situation alerts stay active. Requires administrator access.
  fields:
    node_id:
      required: true
      description: An entity, integration or external capability id from Inventory.
      selector:
        text:
    include_dependents:
      default: false
      description: Include equipment and functions that depend on this capability. Scope follows later graph changes.
      selector:
        boolean:
    until:
      required: true
      description: Explicit ISO timestamp with timezone, in the future and at most seven days away.
      example: "2026-09-25T22:00:00Z"
      selector:
        text:
    reason:
      description: Optional explanation, at most 500 characters.
      selector:
        text:
preview_maintenance:
  name: Preview equipment maintenance
  description: Show the current scope and already-open problems without saving or changing monitoring.
  fields:
    node_id:
      required: true
      selector:
        text:
    include_dependents:
      default: false
      selector:
        boolean:
    until:
      required: true
      description: Explicit ISO timestamp with timezone, in the future and at most seven days away.
      example: "2026-09-25T22:00:00Z"
      selector:
        text:
