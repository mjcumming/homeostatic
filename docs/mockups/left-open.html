<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Left open policy — Homeostatic design preview</title>
  <style>
    :root { color-scheme: light; --preview-bg: #f5f7f8; --preview-ink: #182a34; --preview-muted: #526674; --preview-line: #dce4e9; --preview-accent: #006e96; }
    :root[data-theme="dark"] { color-scheme: dark; --preview-bg: #10171e; --preview-ink: #e4e8ec; --preview-muted: #b2bec9; --preview-line: #41505c; --preview-accent: #57c5ef; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--preview-bg); color: var(--preview-ink); font: 16px/1.5 Roboto, Arial, sans-serif; }
    .preview-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 24px; max-width: 1100px; margin: auto; padding: 12px 24px; }
    .preview-description { display: grid; gap: 2px; }
    .preview-description strong { font-size: 14px; font-weight: 500; }
    .preview-description span, #preview-status { color: var(--preview-muted); font-size: 13px; }
    .preview-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .preview-controls button, .preview-controls label { min-height: 44px; display: inline-flex; align-items: center; gap: 8px; }
    .preview-controls button { font: inherit; font-size: 14px; padding: 8px 12px; border: 1px solid var(--preview-line); border-radius: 6px; color: inherit; background: transparent; cursor: pointer; }
    .preview-controls button[aria-pressed="true"] { color: var(--preview-accent); border-color: currentColor; }
    .preview-controls label { font-size: 14px; padding-left: 8px; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--preview-accent); outline-offset: 3px; }
    #preview-status { min-height: 20px; max-width: 1100px; margin: 0 auto; padding: 0 24px 10px; }
    left-open-preview { display: block; max-width: 1100px; margin: 0 auto 32px; }
    @media (max-width: 520px) { .preview-bar { padding: 12px 16px 4px; gap: 8px; } #preview-status { padding-inline: 16px; } }
  </style>
</head>
<body>
  <div class="preview-bar" aria-label="Design preview controls">
    <div class="preview-description"><strong>Left open policy · Design preview</strong><span>Example sources and settings. Saves stay in this page.</span></div>
    <div class="preview-controls">
      <button type="button" data-preview="editor" aria-pressed="true">Policy editor</button>
      <button type="button" data-preview="behavior" aria-pressed="false">Try the rule</button>
      <label><input id="dark-theme" type="checkbox">Dark theme</label>
    </div>
  </div>
  <p id="preview-status" role="status">Review the form, change its settings, or try an example of the monitoring window.</p>
  <left-open-preview></left-open-preview>
  <script type="module" src="./left-open.mjs"></script>
</body>
</html>
