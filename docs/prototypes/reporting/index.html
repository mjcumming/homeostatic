<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homeostatic · Reporting prototype</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="prototype-bar">
    <span><strong>Interactive prototype</strong><span class="desktop-note"> · Sample devices. No connection to your home.</span></span>
    <div class="preview-tools">
      <button id="phone" aria-pressed="false">Phone view</button>
      <button id="theme" aria-pressed="false">Dark theme</button>
      <details class="demo-tools"><summary>Try a scenario</summary><div class="demo-menu">
        <button data-scenario="normal">Standard setup</button>
        <button data-scenario="missing">Missing phone destination</button>
        <button data-scenario="custom">Existing custom policy</button>
        <button data-scenario="stale">Changed settings during review</button>
        <p>Scenarios reset the sample settings.</p>
      </div></details>
    </div>
  </div>
  <div id="app-shell">
    <header class="app-header">
      <div class="brand"><span class="brand-symbol" aria-hidden="true">⌂</span> Homeostatic</div>
      <nav aria-label="Prototype pages">
        <button data-page="sources">Sources</button>
        <button data-page="notifications">Notifications</button>
      </nav>
      <span class="header-state" id="saved-state"></span>
    </header>
    <main id="app"></main>
    <footer id="savebar" aria-label="Draft changes"></footer>
  </div>
  <dialog id="review" aria-labelledby="review-title"></dialog>
  <dialog id="picker" aria-labelledby="picker-title"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
