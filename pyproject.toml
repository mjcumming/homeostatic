[project]
name = "homeostatic"
version = "0.1.0b10"
description = "Home Assistant health monitoring powered by health-tree"
requires-python = ">=3.14.2,<3.15"
license = "MIT"
dependencies = ["health-tree==0.3.0"]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "homeassistant==2026.9.3",
  "pytest-homeassistant-custom-component==0.13.366",
  "ruff>=0.16.8",
  "mypy>=2.3.1",
  "types-pyyaml>=6.0.12",
  "prek>=0.5.3",
  "home-assistant-frontend==20260826.7",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D", "ASYNC", "T20", "RUF", "SIM"]
ignore = ["E501", "RUF012", "SIM108"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.14"
files = ["custom_components/homeostatic"]
strict = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["voluptuous.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["custom_components.homeostatic"]

[tool.coverage.report]
fail_under = 95
show_missing = true
