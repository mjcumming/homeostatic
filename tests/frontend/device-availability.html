<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Device availability scenarios</title></head>
<body><h1>Device availability scenarios</h1><p>Synthetic Home Assistant data. No live connection.</p><label>Availability <select id="status"><option>available</option><option>partially_available</option><option>unavailable</option><option>unknown</option><option>disabled</option></select></label><div id="result" role="status"></div><homeostatic-card></homeostatic-card>
<script type="module">
import {styles} from "../../custom_components/homeostatic/frontend/styles.mjs?v=43";
import {sourcesBrowser} from "../../custom_components/homeostatic/frontend/sources-workspace.mjs?v=43";
import {monitoringExample} from "./monitoring-fixture.mjs";
const host=document.querySelector("homeostatic-card"),root=host.attachShadow({mode:"open"});
const data=monitoringExample(),id="device:camera-0";
const card={current:{data},sourcesGrouping:"integration",sourcesQuery:"",sourcesNeedsReview:false,sourcesExpanded:new Set(),sourcesSelection:`source:${id}`,sourcesView:"source",sourcesMobileDetail:true,
sourceDetail:{nodeId:id,device_availability:{status:"available",basis:"entities"},members:[{name:"Required sensor",node_id:"sensor.required",state:"unavailable"}],total:1,unavailable_count:1,unknown_count:0}};
function render(){const status=document.querySelector("#status").value;card.sourceDetail.device_availability={status,basis:status==="partially_available"?"integration_reports":"entities"};root.innerHTML=`<style>${styles}</style><div class="shell">${sourcesBrowser(card)}</div>`;document.querySelector("#result").textContent=root.querySelector(".device-availability").textContent;}
document.querySelector("#status").addEventListener("change",render);render();
</script></body></html>
