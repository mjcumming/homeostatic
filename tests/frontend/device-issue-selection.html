<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Device issue selection · isolated acceptance</title>
<style>
:root{--primary-text-color:#202124;--secondary-text-color:#60656a;--primary-background-color:#fafafa;--card-background-color:#fff;--secondary-background-color:#edf2f5;--divider-color:#dde2e5;--primary-color:#007b98;--text-primary-color:#fff;--warning-color:#8a4d06;--error-color:#b3261e;color-scheme:light}:root[data-theme="dark"]{--primary-text-color:#e6e6e6;--secondary-text-color:#b3b9bd;--primary-background-color:#111;--card-background-color:#1c1c1c;--secondary-background-color:#282828;--divider-color:#41464a;--primary-color:#55c9e5;--warning-color:#ffcc82;--error-color:#ffb4ab;color-scheme:dark}body{margin:0;font:16px Arial,sans-serif;background:var(--primary-background-color);color:var(--primary-text-color)}#controls{padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--divider-color)}button,select{font:inherit;min-height:44px;padding:8px}homeostatic-panel{display:block;width:390px;max-width:100%;margin:auto}#feedback,body>details{margin:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere}
</style></head><body>
<div id="controls"><strong>Synthetic sources · mocked services</strong><button id="run">Run selection checks</button><button id="show">Show Monitoring</button><button id="two">Two entity issues</button><button id="one">One entity issue</button><button id="gaps">Missing readings without issues</button><label>Width <select id="width"><option>390</option><option>320</option><option>1200</option><option>1440</option></select></label><label>Theme <select id="theme"><option>light</option><option>dark</option></select></label></div>
<homeostatic-panel></homeostatic-panel><p id="feedback" role="status">Ready: three unavailable entities, four related availability issues.</p><details><summary>Generated acceptance receipt</summary><pre id="receipt"></pre></details>
<script type="module" src="./device-issue-selection.mjs"></script></body></html>
