<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Device findings · isolated test</title>
<style>
:root{--primary-text-color:#212121;--primary-background-color:#fafafa;--card-background-color:#fff;--secondary-background-color:#e5e5e5;--secondary-text-color:#606060;--divider-color:#dedede;--primary-color:#03a9f4;--text-primary-color:#fff;--warning-color:#9c6500;--error-color:#db4437}:root[data-theme="dark"]{--primary-text-color:#e1e1e1;--secondary-text-color:#a0a0a0;--primary-background-color:#111;--card-background-color:#1c1c1c;--secondary-background-color:#282828;--divider-color:#383838;--warning-color:#f5b942;color-scheme:dark}body{margin:0;font:16px Arial,sans-serif;background:var(--primary-background-color);color:var(--primary-text-color)}#controls{padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--divider-color)}button{font:inherit;min-height:44px;padding:8px}#feedback{margin:12px;overflow-wrap:anywhere}homeostatic-panel{display:block;max-width:1100px;margin:auto}body>details{padding:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere}
</style></head><body>
<div id="controls"><strong>Synthetic devices · no live services</strong><button id="reset">Reset examples</button><button id="run">Run checks</button><label><input type="checkbox" id="dark">Dark theme</label></div>
<p id="feedback" role="status">Each device appears beneath its integration. Its View opens all current device problems; standalone and shared issues retain their original scope.</p>
<homeostatic-panel></homeostatic-panel>
<details><summary>Machine-readable acceptance receipt</summary><pre id="receipt"></pre></details>
<script type="module" src="./device-issues-scenario.mjs"></script></body></html>
