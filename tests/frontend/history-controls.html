<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Homeostatic history and control scenarios</title>
<style>
:root{--primary-text-color:#182a34;--primary-background-color:#f5f7f8;--card-background-color:#fff;--secondary-background-color:#edf2f5;--secondary-text-color:#546875;--divider-color:#dce4e9;--primary-color:#007eab;--text-primary-color:#fff}body{margin:0;font:14px Arial,sans-serif}header{padding:14px}homeostatic-card{max-width:1100px;margin:auto}button{font:inherit;padding:9px}#result{white-space:pre-wrap}
</style>
<header><strong>Synthetic data only</strong> <button id="run">Run history and control scenarios</button><p id="result" role="status">Ready</p></header>
<homeostatic-card></homeostatic-card>
<details><summary>Machine-readable acceptance receipt</summary><pre id="receipt"></pre></details>
<script type="module">
import "../../custom_components/homeostatic/frontend/homeostatic.js";
import {emptyReceipt,recordResult} from "./control-path-inventory.mjs";
const card=document.querySelector("homeostatic-card");
const result=document.querySelector("#result");
let publish;
const listeners=new Map();
const source={node_id:"sensor.a",name:"Living room motion",kind:"entity",watched:true,requirements:[],attributes:{area:["living"]},attached_by:["watch"],entity_id:"binary_sensor.motion"};
const fn={...source,node_id:"function.lighting",name:"Motion lighting",kind:"function",requirements:["sensor.a"],readiness:{answer:"blocked",nodes:[]}};
const episode={episode_id:"open-1",anchor:"sensor.a",opened_at:"2026-09-25T10:00:00Z",importance:"normal",impact:[fn.node_id],reasons:[{reason:"unavailable",message:"Living room motion is unavailable"}]};
const history={started_at:"2026-09-24T10:00:00Z",retention:{max_episodes:100,max_age_days:30},episodes:Array.from({length:45},(_,i)=>({episode:{...episode,episode_id:`ended-${i}`,anchor:i===1?"device:old-controller":episode.anchor,labels:i===1?{name:"Former controller"}:episode.labels,reasons:i===0?[{check_id:"availability",reason:"some_unavailable",message:"Family Room Frigate: some unavailable"}]:i===1?[{check_id:"availability",reason:"all_unavailable",message:"Former controller: all unavailable"}]:episode.reasons},source:i===1?null:{node_id:source.node_id,name:i===0?"Family Room Frigate":i===4?'<img src=x onerror="fail()"> Old name':`Previous sensor ${i}`,kind:i===0?"device":"entity"},resolved_at:"2026-09-25T11:00:00Z",resolution:["cleared","removed","absorbed"][i%3],absorbed_into:i%3===2?"open-1":null}))};
let data;
function reset(){
  data={schema_version:1,available:true,updated_at:"2026-09-25T12:00:00Z",readiness:{answer:"blocked"},evidence_gaps:0,functions:[fn],areas:[{id:"living",name:"Living room",floor_id:"main"}],floors:[{id:"main",name:"Main floor"}],
    inventory:{nodes:[source,fn],episodes:[episode],catalog:{watched:1,candidates:[]},attention_controls_supported:true,operator_controls:[],resolved_history:structuredClone(history),enrollment_changes:[],notification_requests:[]},
    coverage:{no_checks:[],never_observed:[],stale:[],notification_consumer_missing:false},policy:{notifications_enabled:false,routes:{},episodes:[]}};
}
reset();
let fail=false,hold=null;
const calls=[];
const connection={addEventListener(name,handler){listeners.set(name,handler);},removeEventListener(name){listeners.delete(name);},async subscribeMessage(fn){publish=fn;queueMicrotask(()=>fn(data));return()=>{};}};
const hass={connection,user:{id:"admin",is_admin:true},async callWS(message){
  calls.push(message);
  if(message.type==="homeostatic/node")return{source:data.inventory.nodes.find(n=>n.node_id===message.node_id),readiness:{answer:"blocked",nodes:[]},explanation:{findings:episode.reasons,nodes:[]},impact:{nodes:[]}};
  if(message.type!=="call_service")throw new Error("No configuration service is needed by this fixture.");
  if(fail)throw new Error("Storage could not be confirmed");
  const request=message.service_data;
  if(message.service==="acknowledge") {
    if(hold)await hold.promise;
    const acknowledgment={episode_id:request.episode_id,at:"2026-09-26T12:00:00Z",actor_id:"admin"};
    data.policy.episodes=[{episode_id:request.episode_id,acknowledgment,require_acknowledgment:true}];
    return{response:{acknowledgment}};
  }
  if(message.service==="cancel_control") {
    data.inventory.operator_controls=data.inventory.operator_controls.filter((item)=>item.control_id!==request.control_id);
    return{response:{cancelled_control_id:request.control_id}};
  }
  const scope={node_ids:request.include_dependents?[source.node_id,fn.node_id]:[source.node_id],functions:request.include_dependents?[fn.node_id]:[],existing_episode_ids:["open-1"],until:request.until,existing_alerts_continue:true};
  if(message.service==="preview_maintenance")return{response:scope};
  if(hold)await hold.promise;
  const control={control_id:"saved",action:message.service==="shelve"?"shelve":"maintenance",target:request.episode_id??request.node_id,until:request.until,reason:request.reason,include_dependents:request.include_dependents??false};
  data.inventory.operator_controls.push(control);
  return{response:{...scope,control}};
}};
card.setConfig({view:"issues"});card.hass=hass;
const root=card.shadowRoot;
const flush=async()=>{for(let i=0;i<24;i++)await Promise.resolve();};
const expect=(value,message)=>{if(!value)throw new Error(message);};
const click=async(selector,scope=root)=>{const button=scope.querySelector(selector);expect(button,`Missing rendered control: ${selector}`);expect(!button.disabled&&!button.closest("[inert]"),`Disabled rendered control: ${selector}`);button.scrollIntoView({block:"nearest"});const box=button.getBoundingClientRect(),hit=root.elementFromPoint(box.x+box.width/2,box.y+box.height/2);expect(box.width>0&&box.height>0&&(button===hit||button.contains(hit)),`Hidden or covered control: ${selector}`);button.click();await flush();};
const input=(selector,value,scope=root)=>{const field=scope.querySelector(selector);expect(field,`Missing field: ${selector}`);field.focus();field.value=value;field.dispatchEvent(new Event("input",{bubbles:true}));};
const close=async()=>{if(card.tools.dialog.open)await click('[data-tool="close"]',card.tools.dialog);if(card.dialog.open)await click('[data-action="close"]',card.dialog);};
const end=()=>{const d=new Date(Date.now()+3600000);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16);};
const submit=()=>card.tools.body.querySelector('[type="submit"]');
const mutations=()=>calls.filter(call=>call.type==="call_service");
async function issue(){
  await close();await click('[data-page="problems"]');
  for(const button of [...root.querySelectorAll('[data-issue-group][aria-expanded="false"]')])await click(`[data-issue-group="${button.dataset.issueGroup}"]`);
  await click('[data-episode="open-1"]');
}
const historyContent=()=>root.querySelector('.history-content:not([hidden])');
async function historyRow(id){await close();const selector=`[data-history-toggle="${id}"]`;if(root.querySelector(selector)?.getAttribute('aria-expanded')!=='true')await click(selector);}
let receipt;
function report(){document.querySelector('#receipt').textContent=JSON.stringify(receipt,null,2);parent.postMessage({type:'homeostatic-acceptance',fixture:'history-controls.html',receipt},location.origin);}
async function path(id,run,evidence){try{await run();recordResult(receipt,id,'pass',evidence);}catch(error){recordResult(receipt,id,'fail',error.message);throw error;}finally{report();}}
document.querySelector("#run").addEventListener("click",async()=>{
  receipt=emptyReceipt({fixture:'history-controls.html',browser:navigator.userAgent,viewport:{width:innerWidth,height:innerHeight},data:'synthetic',destinations:'mocked'});
  result.textContent='Running…';document.querySelector('#run').disabled=true;
  try{
    fail=false;hold=null;await close();reset();card.hass=hass;publish(data);await flush();
    await path('issues.history',async()=>{
      await click('[data-page="problems"]');
      expect([...root.querySelectorAll('.nav button')].map(button=>button.textContent).join('|')==="Open issues|Monitoring|Policies|Notifications|History","History has its own destination");
      await click('[data-page="history"]');
      input('[data-history-search]','');input('[data-history-filter]','');
      expect(root.querySelector('main [role="status"]').textContent.includes('45 problems'),'History uses visible problem terminology');
      expect(root.querySelectorAll('main [data-history-toggle]').length===20,'History first page has 20 rows');
      expect(root.querySelector('[data-tool="previous"]').disabled,'Previous is disabled on the first page');
      await click('[data-tool="next"]');await click('[data-tool="next"]');
      expect(root.querySelectorAll('main [data-history-toggle]').length===5,'Last page has five remaining rows');
      expect(root.querySelector('[data-tool="next"]').disabled,'Next is disabled on the last page');
      await click('[data-tool="previous"]');expect(root.querySelectorAll('main [data-history-toggle]').length===20,'Previous returns to the middle page');
      input('[data-history-search]','Previous sensor 2');
      expect(root.activeElement===root.querySelector('[data-history-search]'),'Search retains keyboard focus');
      expect(root.querySelectorAll('main [data-history-toggle]').length===11,'Search resets pagination and filters records');
      publish(data);await flush();expect(root.querySelector('[data-history-search]').value==='Previous sensor 2','Live publication retains search');
      input('[data-history-search]','');input('[data-history-filter]','removed');
      expect(root.querySelectorAll('main [data-history-toggle]').length===15,'Outcome filter shows only 15 monitoring-ended records');
      expect(!root.querySelector('[data-tool="previous"]'),'A single page needs no pagination controls');
      input('[data-history-search]','no matching source');expect(root.querySelector('main').textContent.includes('No past issues match'),'Empty filtered result is explicit');
      input('[data-history-search]','');input('[data-history-filter]','');
      await historyRow('ended-0');
      expect(!card.tools.dialog.open&&!card.dialog.open,'History expands in the list without a modal');
      expect(historyContent().textContent.includes('some monitored entities on this device as unavailable'),'Saved condition is readable');
      expect(historyContent().querySelector('.history-times dt').textContent==='Observed','History identifies observation times');
      expect(historyContent().querySelector('.history-times dd').textContent.includes('1 hr'),'History shows recorded issue duration');
      expect(!historyContent().querySelector('details'),'Short findings have no nested disclosure');
      const expanded=root.querySelector('[data-history-toggle="ended-0"]');expanded.focus();
      publish(data);await flush();
      expect(root.querySelector('[data-history-toggle="ended-0"]').getAttribute('aria-expanded')==='true','The row stays expanded during a monitoring update');
      expect(root.activeElement.dataset.historyToggle==='ended-0','Monitoring updates preserve keyboard focus');
      await click('[data-history-toggle="ended-0"]');
      expect(!historyContent()&&root.activeElement.dataset.historyToggle==='ended-0','Collapsing returns to the same row');
      await historyRow('ended-1');
      expect(root.querySelector('[data-history-toggle="ended-1"]').textContent.includes('Former controller'),'Deleted device retains its saved name');
      expect(historyContent().textContent.includes('every monitored entity on this device as unavailable'),'Saved device condition remains readable');
      expect(historyContent().textContent.includes('without an observed recovery'),'Removal does not claim recovery');
      await historyRow('ended-4');expect(!root.querySelector('main img'),'Saved source names remain escaped text');
      await historyRow('ended-2');await click('[data-open-episode="open-1"]',historyContent());
      expect(card.dialog.open&&root.querySelector('#detail-title').textContent===source.name,'Related problem opens its current details');
      await close();
      data.inventory.resolved_history.episodes[2].absorbed_into='ended-42';publish(data);await flush();
      await historyRow('ended-2');await click('[data-history="ended-42"]',historyContent());
      expect(card.tools.page===2&&root.querySelector('[data-history-toggle="ended-42"]').getAttribute('aria-expanded')==='true','A related retained issue is revealed on its later page');
      await click('[data-tool="previous"]');await click('[data-tool="previous"]');
      await historyRow('ended-0');
      listeners.get('disconnected')();await flush();
      expect(root.querySelector('main').inert&&historyContent(),'Disconnected history stays visible and read-only');
      publish(data);await flush();expect(!root.querySelector('main').inert&&historyContent(),'Reconnection retains the expanded row');
      data.inventory.resolved_history.episodes=[];publish(data);await flush();
      expect(root.querySelector('main').textContent.includes('no longer in retained history'),'Expired selection reports its retention limit inline');
      reset();publish(data);await flush();
      await click('[data-history-toggle="ended-0"]');publish(data);await flush();
      expect(!historyContent()&&!card.tools.dialog.open,'Collapsed history stays collapsed after publication');
      expect(!mutations().length,'History never requests a mutation');
    },'Clicked History, Next/Previous, outcome filter, search and inline expansion/collapse; verified empty results, retained keyboard focus, saved names, escaped text, concise distinct outcomes, related open and retained issue navigation across pages, reconnect and expired-record handling. No mutation was requested.');
    await path('issues.controls',async()=>{
      await issue();
      expect(root.querySelector('[data-acknowledge]').closest('.problem-controls .actions')===root.querySelector('[data-shelf]').closest('.problem-controls .actions'),'Attention controls share a visible action row');
      await click('[data-shelf]');
      expect(submit().disabled,'Pause needs an expiry');
      expect(card.tools.body.querySelectorAll('.control-target').length===1&&card.tools.body.querySelector('.control-target').textContent===source.name,'Pause names its source once');
      expect(card.tools.body.textContent.includes('this whole issue for everyone')&&card.tools.body.textContent.includes('including urgent notifications'),'Pause explains exact problem and urgent scope');
      expect(!card.tools.body.querySelector('[name="includeDependents"]'),'Pause has no equipment-wide scope field');
      input('[name="untilLocal"]',end(),card.tools.body);
      await click('details summary',card.tools.body);input('[name="reason"]','Replacing battery',card.tools.body);
      publish(data);await flush();expect(card.tools.body.querySelector('[name="reason"]').value==='Replacing battery','Live publication preserves draft');
      fail=true;const before=mutations().length;await click('[type="submit"]',card.tools.body);
      expect(mutations().length===before+1,'Ambiguous failure is not automatically retried');
      expect(card.tools.body.textContent.includes('may already have been saved'),'Ambiguous save asks the user to inspect state');
      fail=false;listeners.get('disconnected')();await flush();expect(submit().disabled,'Disconnected pause cannot submit');
      publish(data);await flush();expect(!submit().disabled,'Fresh publication restores valid pause');
      data.inventory.episodes=[];publish(data);await flush();expect(submit().disabled,'Resolved target cannot be paused');
      reset();publish(data);await flush();
      let release;hold={promise:new Promise(resolve=>{release=resolve;})};
      const savedBefore=mutations().length;submit().click();submit().click();await flush();
      expect(mutations().length===savedBefore+1,'Repeated click during save sends one mutation');
      release();await flush();hold=null;
      expect(card.tools.body.textContent.includes('Saved by Home Assistant'),'Saved pause is confirmed');
      expect(data.inventory.operator_controls.length===1&&data.inventory.operator_controls[0].target==='open-1','Mock durable state contains only the selected problem pause');
      expect(mutations().at(-1).service_data.episode_id==='open-1'&&!Object.hasOwn(mutations().at(-1).service_data,'node_id'),'Pause request targets only its selected problem');
      await issue();expect(root.querySelector('.dialog-body .problem-controls .active-controls').textContent.includes('Notifications paused')&&root.querySelector('.dialog-body .problem-controls .active-controls').textContent.includes('Until'),'Reopened issue displays saved expiry once');
      expect(!root.querySelector('.dialog-body [data-maintenance]'),'Issue dialog does not offer equipment maintenance');
      await click('[data-acknowledge]');expect(card.tools.body.textContent.includes('issue remains open'),'Acknowledgment explains unchanged health');
      expect(card.tools.body.querySelector('[data-immediate-feedback]').hidden,'Unchanged confirmation has no empty feedback space');
      const ackBefore=mutations().length;await click('[type="submit"]',card.tools.body);
      expect(mutations().length===ackBefore+1&&mutations().at(-1).service==='acknowledge','Acknowledgment sends one action');
      expect(!Object.hasOwn(mutations().at(-1).service_data,'actor_id'),'Client cannot select acknowledgment actor');
      expect(data.policy.episodes[0].acknowledgment.actor_id==='admin','Mock backend records authenticated actor');
      expect(card.tools.body.textContent.includes('Awareness recorded'),'Acknowledgment confirms returned result');
      publish(data);await flush();await issue();
      expect(root.querySelector('.dialog-body').textContent.includes('Acknowledged')&&!root.querySelector('[data-acknowledge]'),'Reopened acknowledged issue has no duplicate acknowledgment');
      expect(root.querySelectorAll('.dialog-body .control-status').length===1&&!root.querySelector('.dialog-body .problem-controls .panel, .dialog-body .problem-controls .note'),'Acknowledgment and active pause use flat controls without nested panels');
      await click('[data-cancel-control]');
      expect(card.tools.body.textContent.includes('Due notifications may be sent now'),'Ending pause explains renewed attention');
      fail=true;const cancelBefore=mutations().length;await click('[type="submit"]',card.tools.body);
      expect(mutations().length===cancelBefore+1&&card.tools.body.textContent.includes('may already have been saved'),'Cancellation failure does not retry');
      fail=false;listeners.get('disconnected')();await flush();expect(submit().disabled,'Disconnected cancellation cannot submit');
      publish(data);await flush();await click('[type="submit"]',card.tools.body);
      expect(card.tools.body.textContent.includes('selected control has ended')&&data.inventory.operator_controls.length===0,'Cancellation removes only selected saved control');
      await close();reset();publish(data);await flush();await issue();await click('[data-acknowledge]');
      data.inventory.episodes=[];publish(data);await flush();expect(submit().disabled,'Resolved acknowledgment target cannot submit');
      await close();reset();data.inventory.attention_controls_supported=false;publish(data);await flush();await issue();
      expect(!root.querySelector('[data-acknowledge]'),'Unsupported attention API hides acknowledgment');
      await close();card.hass={...hass,user:{id:'viewer',is_admin:false}};await flush();
      expect(root.querySelector('main').textContent.includes('Administrator access is required'),'Viewer cannot reach operator controls');
      expect(!root.querySelector('main [data-acknowledge], main [data-shelf], main [data-maintenance]')&&!card.dialog.open&&!card.tools.dialog.open,'Viewer has no reachable mutation control');
      card.hass=hass;reset();publish(data);await flush();
    },'Clicked issue group/detail, Pause, expiry/reason fields, submit, Acknowledge and End control; inspected exact mock saved scope, actor, reopened expiry/acknowledgment, duplicate suppression, ambiguous errors, disconnect recovery, resolved-target and non-admin/API gates. No live sends.');
    result.textContent='PASS: History and issue controls exercised through rendered controls.';
  }catch(error){result.textContent='FAIL: '+error.stack;}finally{document.querySelector('#run').disabled=false;report();}
});
if(new URLSearchParams(location.search).has('run'))document.querySelector('#run').click();
</script>
</html>
