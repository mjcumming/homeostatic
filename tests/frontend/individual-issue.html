<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Individual issue preview</title>
<style>
:root{--primary-text-color:#182a34;--secondary-text-color:#536575;--primary-background-color:#f5f7f8;--card-background-color:#fff;--secondary-background-color:#edf2f5;--divider-color:#dce4e9;--primary-color:#007eab;color-scheme:light}
:root[data-theme="dark"]{--primary-text-color:#e4e8ec;--secondary-text-color:#aab8c5;--primary-background-color:#10171e;--card-background-color:#18232d;--secondary-background-color:#263744;--divider-color:#41505c;--primary-color:#57c5ef;color-scheme:dark}
body{margin:0;font:14px Arial,sans-serif;background:var(--primary-background-color);color:var(--primary-text-color)}header{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{font:inherit;padding:8px}homeostatic-panel{display:block;width:1100px;max-width:100%;margin:auto}#result,#receipt{margin:12px;white-space:pre-wrap;overflow-wrap:anywhere}#receipt{max-height:240px;overflow:auto}
</style></head><body>
<header><strong>Individual issue · synthetic data</strong><button id="run">Run individual issue checks</button><button id="open">Open temperature issue</button><label>Condition <select id="condition"><option value="low">Below minimum</option><option value="high">Above maximum</option><option value="missing">Missing reading</option><option value="recovered">Back within limits</option><option value="stalled">Thermostat stalled</option><option value="worsening">Thermostat worsening</option></select></label><label>Theme <select id="theme"><option>light</option><option>dark</option></select></label></header>
<homeostatic-panel></homeostatic-panel><p id="result" role="status">Ready</p><details><summary>Generated acceptance receipt</summary><pre id="receipt"></pre></details>
<script type="module" src="./individual-issue-scenario.mjs"></script>
</body></html>
