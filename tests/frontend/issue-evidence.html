<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grouped issue evidence</title>
<style>
:root{--primary-text-color:#182a34;--secondary-text-color:#536575;--primary-background-color:#f5f7f8;--card-background-color:#fff;--secondary-background-color:#edf2f5;--divider-color:#dce4e9;--primary-color:#007eab;--text-primary-color:#fff;color-scheme:light}
:root[data-theme="dark"]{--primary-text-color:#e4e8ec;--secondary-text-color:#aab8c5;--primary-background-color:#10171e;--card-background-color:#18232d;--secondary-background-color:#263744;--divider-color:#41505c;--primary-color:#57c5ef;--text-primary-color:#10171e;color-scheme:dark}
body{margin:0;font:14px Arial,sans-serif;background:var(--primary-background-color);color:var(--primary-text-color)}
#controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:12px}label{display:flex;gap:6px;align-items:center}select,button{font:inherit;padding:7px}#feedback{margin:0;padding:0 12px 10px}iframe{display:block;border:1px solid var(--divider-color);margin:0 auto;width:calc(100% - 24px);max-width:1200px;height:844px;box-sizing:content-box}
homeostatic-panel{display:block}body.embedded #controls,body.embedded #feedback,body.embedded>details,body.embedded iframe,body:not(.embedded) homeostatic-panel{display:none}
</style></head><body>
<div id="controls"><strong>Synthetic issue examples · no live services</strong>
<label>Current evidence <select id="state"><option value="active">Unavailable readings</option><option value="partial">Some readings recovered</option><option value="recovered">All readings recovered</option></select></label>
<label>Variant <select id="variant"><option value="vacuum">Cabin vacuum and dock, restored evidence</option><option value="devices">3 devices, overlapping thermostat policies</option><option value="phone">Michael’s iPhone, 10 synthetic readings</option><option value="standalone">Also a standalone entity</option><option value="aliases">Canonical thermostat metadata absent</option><option value="missing">An unknown recorded source</option><option value="mixed">Mixed conditions</option></select></label>
<label><input type="checkbox" id="narrow" checked>390px phone viewport</label><label><input type="checkbox" id="dark">Dark theme</label>
<button id="run" type="button">Run browser checks</button></div>
<p id="feedback" role="status"></p><details><summary>Acceptance receipt</summary><pre id="receipt"></pre></details><iframe title="Isolated Homeostatic issue viewport"></iframe><homeostatic-panel></homeostatic-panel>
<script type="module">
import "../../custom_components/homeostatic/frontend/homeostatic.js";
import {emptyNotificationDefinitions} from "../../custom_components/homeostatic/frontend/reusable-editors.mjs";
import {emptyReceipt,recordResult} from "./control-path-inventory.mjs";
import {visibleEpisodes} from "../../custom_components/homeostatic/frontend/model.mjs";
import {issueEvidenceFixture,issueEvidenceReply,lyricLocalize,THERMOSTAT_ENTITY} from "./issue-evidence-fixture.mjs";

const params=new URLSearchParams(location.search),embedded=params.has("embedded");
if(!embedded) {
  const frame=document.querySelector("iframe"),feedback=document.querySelector("#feedback");
  const inputs=Object.fromEntries(["state","variant","narrow","dark"].map(id=>[id,document.getElementById(id)]));
  inputs.state.value=params.get("state")||"active";inputs.variant.value=params.get("variant")||"vacuum";
  inputs.narrow.checked=!params.has("wide");inputs.dark.checked=params.has("dark");
  const refresh=()=>{
    const next=new URLSearchParams({embedded:"1",state:inputs.state.value,variant:inputs.variant.value});
    if(inputs.dark.checked)next.set("dark","1");
    frame.style.width=inputs.narrow.checked?"390px":"calc(100% - 24px)";
    frame.src=`issue-evidence.html?${next}`;feedback.textContent="The modal uses the real card in an isolated browser viewport.";
  };
  Object.values(inputs).forEach(input=>input.addEventListener("change",refresh));
  document.querySelector("#run").addEventListener("click",async()=>{
    const receipt=emptyReceipt({fixture:"issue-evidence.html",browser:navigator.userAgent,viewport:{width:frame.clientWidth,height:frame.clientHeight},data:"synthetic",destinations:"none"});
    try{feedback.textContent=await frame.contentWindow.runIssueEvidenceChecks();for(const id of ["issues.evidence","issues.recovery"])recordResult(receipt,id,"pass",feedback.textContent);}
    catch(error){feedback.textContent="FAIL: "+error.message;recordResult(receipt,"issues.evidence","fail",error.message);}
    document.querySelector("#receipt").textContent=JSON.stringify(receipt,null,2);parent.postMessage({type:"homeostatic-acceptance",fixture:"issue-evidence.html",receipt},location.origin);
  });
  refresh();
} else {
  document.body.classList.add("embedded");
  document.documentElement.dataset.theme=params.has("dark")?"dark":"light";
  const card=document.querySelector("homeostatic-panel"),calls=[];
  let fixture;
  card._hass={user:{is_admin:true},config:{time_zone:"America/Chicago"},states:{},localize:lyricLocalize,
    async callWS(request) {
      calls.push(structuredClone(request));
      if(["homeostatic/node","homeostatic/source"].includes(request.type))return issueEvidenceReply(fixture,request.type,request.node_id);
      throw Error("Only read-only source queries are allowed in this fixture: "+request.type);
    }};
  const check=(condition,message)=>{if(!condition)throw Error(message);};
  async function show(state="active",variant="devices") {
    fixture=issueEvidenceFixture({state,variant});
    card.current={status:"current",data:fixture.data};card.page="problems";
    card.editors.configuration={settings:{notifications:fixture.data.policy.notifications_enabled,monitoring_policies:fixture.policies,notification_definitions:emptyNotificationDefinitions("America/Chicago")}};
    card.editors.settingsDraft=structuredClone(card.editors.configuration.settings);
    card.issueGroupsExpanded=new Set();card.sourceDetail=null;
    if(state!=="recovered"){card.detail=null;card.dialog.close();}
    card.render();
    if(state!=="recovered") {
      const domain=fixture.integration.attributes.domain[0];
      const group=card.shadowRoot.querySelector(`[data-issue-group="integration:${domain}"]`);check(group,"Reachable integration group");group.click();
      const queue=card.shadowRoot.querySelector(".issue-group-body");
      const issue=queue.querySelector(`[data-episode="${fixture.episode.episode_id}"]`);check(issue,"Reachable exact issue action");
      check([...queue.querySelectorAll('[data-episode]')].every(row=>row.dataset.episode===fixture.episode.episode_id),"Device entries retain the original issue identity");
      check(!queue.querySelector('[data-source-link],.issue-members'),"Queue has one route and no raw evidence list");
      check(!/View details|View in Sources|View in Monitoring|Recorded findings|Reporting off|Notifications off/.test(queue.innerText),"Queue avoids duplicate actions and reporting jargon");
      if(variant==="phone")check(issue.closest('[data-issue-device]')?.querySelector('.issue-device-title')?.textContent==="Michael’s iPhone"&&issue.querySelector('.issue-title').textContent==="Availability"&&issue.querySelector('.issue-condition').textContent==="10 entities unavailable","Phone queue names the device once above its findings and condition");
      issue.click();
      for(let turn=0;turn<12;turn++)await Promise.resolve();
    } else await card.loadDetail();
  }
  card.shadowRoot.addEventListener("click",event=>{
    const link=event.target.closest("a[href]");
    if(link){event.preventDefault();card.dataset.lastFixtureNavigation=link.getAttribute("href");}
  });
  window.runIssueEvidenceChecks=async()=>{
    const root=card.shadowRoot;
    await show();
    const body=root.querySelector(".dialog-body");
    check(root.querySelector(".problem-headline")?.textContent==="Unavailable readings from 3 devices","Grouped issue headline");
    check(body.querySelectorAll("[data-evidence-group]").length===3,"Three device groups");
    check(body.querySelectorAll("[data-evidence-source]").length===5,"Five canonical entities visible up front");
    check(!body.querySelector('[data-disclosure="issue-details"]'),"Supporting evidence has no Details expander");
    check(!body.innerText.includes("View in Monitoring"),"Generic Monitoring route is absent");
    check(!/Inspect entity|Inspect device checks/.test(body.textContent),"Repeated inspection commands are absent");
    check(body.querySelectorAll('a.primary[href^="/config/devices/device/"]').length<=1,"Device rows do not repeat primary buttons");
    check(!body.querySelector('.next-action a.primary[href*="/config/integrations"]'),"A loaded connection is not the primary action");
    const thermostat=body.querySelector(`[data-evidence-source="${THERMOSTAT_ENTITY}"]`);
    check(thermostat?.innerText.includes("Main Floor Thermostat")&&thermostat.innerText.includes("Unavailable in Home Assistant")&&!thermostat.closest('details'),"Same-name entity and its condition remain visible");
    await card.loadDetail();
    check(!body.querySelector('[data-disclosure="issue-details"]'),"Refresh retains the flat evidence layout");
    check(body.innerText.includes("Entity availability")&&body.innerText.includes("Thermostat availability"),"Both overlapping check contributions remain visible");
    check(body.scrollWidth<=body.clientWidth+1,"Modal has no horizontal overflow");
    check(card.dialog.getBoundingClientRect().right<=innerWidth+1,"Modal fits its viewport");
    check(body.querySelectorAll('[data-check-source]').length===8,"All current check contributions appear together without nested disclosures");
    const source=body.querySelector('[data-source-link="entity:registry:third-floor-temperature"]');
    check(source?.getClientRects().length,"Entity name is a visible Monitoring destination");source.click();for(let turn=0;turn<12;turn++)await Promise.resolve();
    check(card.page==="sources"&&card.sourcesSelection==="source:entity:registry:third-floor-temperature","Entity action targets its canonical source");
    check(card.sourceDetail?.nodeId==="entity:registry:third-floor-temperature"&&!card.sourceDetail.error,"Monitoring action reads synthetic evidence");
    await show("partial");
    check(root.querySelector(".problem-headline")?.textContent==="Unavailable readings from 2 devices","Partial recovery headline");
    check(body.querySelectorAll("[data-evidence-group]").length===2,"Recovered device no longer counted");
    check(body.querySelector('.issue-recorded')?.textContent.includes("3rd Floor Sensor"),"Earlier recorded sources remain in flat supporting detail");
    check(visibleEpisodes(fixture.data).length===1,"Partial recovery stays visible");
    await show("recovered");
    check(visibleEpisodes(fixture.data).length===0,"Fully recovered issue hidden from active queue");
    check(!body.querySelector("[data-evidence-group]"),"No stale affected evidence after full recovery");
    check(root.querySelector(".problem-headline")?.textContent.includes("confirming recovery"),"Retained issue explains recovery confirmation");
    await show("active","phone");
    check(root.querySelector("#detail-title")?.textContent==="Michael’s iPhone","Phone title identifies the device once");
    check(root.querySelector(".problem-headline")?.textContent==="10 entities unavailable","Phone headline states the affected entity count");
    check(body.querySelectorAll("[data-evidence-group]").length===1,"Phone issue has one device group");
    check(body.querySelectorAll("[data-evidence-source]").length===10,"Phone issue retains ten canonical readings");
    check(!body.querySelector('.affected-readings')?.closest('details'),"Phone readings are visible without disclosure");
    check(!body.querySelector('[data-disclosure="issue-details"]'),"Phone supporting evidence is flat");
    check(!/Inspect entity|Inspect device checks|Open an affected device/.test(body.textContent),"Phone task avoids repeated navigation instructions");
    check(body.querySelectorAll('a[href="/config/devices/device/synthetic-iphone"]').length===1,"Phone has one Home Assistant device destination");
    const phoneReadings=body.querySelector('.affected-readings');
    check(phoneReadings.querySelectorAll("[data-source-link]").length===10,"Every phone reading remains inspectable");
    check(phoneReadings.innerText.includes("Activity")&&phoneReadings.innerText.includes("Average Active Pace")&&phoneReadings.innerText.includes("Current Cadence")&&phoneReadings.innerText.includes("Current Pace"),"Supplied phone-reading examples remain visible");
    check(body.scrollWidth<=body.clientWidth+1,"Expanded phone readings fit the modal");
    const phoneEntity=phoneReadings.querySelector('[data-source-link="entity:registry:synthetic-iphone-activity"]');
    check(phoneEntity?.getClientRects().length,"Phone entity destination is visibly reachable");phoneEntity.click();for(let turn=0;turn<12;turn++)await Promise.resolve();
    check(card.page==="sources"&&card.sourcesSelection==="source:entity:registry:synthetic-iphone-activity","Phone reading opens its canonical source");
    check(calls.every(call=>["homeostatic/node","homeostatic/source"].includes(call.type)),"Only read-only fixture queries");
    await show("active","vacuum");
    check(root.querySelector('.problem-headline').innerText==="2 devices need attention","Vacuum scope counts devices without adding their entities again");
    check(body.querySelector('[data-source-link="entity:registry:cabin"]').innerText==="Cabin","Vacuum retains its same-name identity");
    check(body.innerText.includes('Dust emptying')&&body.innerText.includes('Only a restored state is available')&&body.innerText.includes('Current availability not confirmed'),"Specific restored entity and incomplete device conditions appear before expansion");
    check(!body.querySelector('[data-disclosure="issue-details"]'),"Vacuum supporting evidence is flat");
    check(body.innerText.includes('Second Floor Dock')&&body.querySelector('.issue-notification-links'),"Recorded sources and notification configuration remain available");
    check(!/policy_default|Home Assistant reports roborock loaded|View Cabin .*Monitoring|Open integration in Home Assistant/.test(body.textContent),"Internal identifiers and redundant integration wording are absent");
    check(body.querySelectorAll('[data-source-link="entry:synthetic-roborock"]').length===0,"Generic integration Monitoring detour is absent");
    check(body.scrollWidth<=body.clientWidth+1,"Expanded vacuum details fit the viewport");
    await show(params.get("state")||"active",params.get("variant")||"vacuum");
    return "PASS: visible names and conditions, truthful device counts, flat supporting evidence, complete recorded scope and policy contributions, named evidence navigation, refresh retention, partial/full recovery, phone and restored-vacuum examples; no service calls.";
  };
  await show(params.get("state")||"active",params.get("variant")||"vacuum");
}
</script></body></html>
