<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Policy delivery workflow</title>
<style>body{font:14px Arial,sans-serif;margin:20px;background:#fafafa;color:#212121}#status{margin:12px 0}button{font:inherit;padding:8px}homeostatic-card-v21{display:block;max-width:1200px}</style></head>
<body><p>Isolated workflow fixture. No connection to Home Assistant and no messages are sent.</p><button id="checks">Run workflow checks</button><p id="status" role="status">Ready</p><homeostatic-card-v21></homeostatic-card-v21>
<script type="module">
import '/custom_components/homeostatic/frontend/homeostatic.js';
import {monitoringExample} from '/tests/frontend/monitoring-fixture.mjs';
import {emptyNotificationDefinitions,newMonitoringPolicy} from '/custom_components/homeostatic/frontend/reusable-editors.mjs';
const definitions=emptyNotificationDefinitions('America/Chicago');
definitions.methods.phone={name:'Owner phone',mode:'fixed',destinations:['phone:owner']};
const policy={...newMonitoringPolicy([],'integration'),name:'Integration availability',enabled:true,notifications:[{id:'now',timing:{mode:'immediate'},methods:['phone']}]};
let saved={monitoring_policies:[policy],notification_definitions:definitions,policy:{timezone:'America/Chicago',rules:[],recipients:{}},timings:{},notifications:false,consumer:null};
const requests=[];
const delivery={delivery_targets:[{channel:'phone:owner',name:'Owner iPhone',type:'app',available:true},{channel:'satellite:kitchen',name:'Kitchen speaker',type:'voice',available:true}],notification_people:[],notification_destinations:[],consumers:[]};
const card=document.querySelector('homeostatic-card-v21');
const connection={addEventListener(){},removeEventListener(){},async subscribeMessage(callback){queueMicrotask(()=>callback(monitoringExample()));return ()=>{};}};
const hass={connection,user:{id:'fixture',is_admin:true},states:{},async callWS(request){
 requests.push(structuredClone(request));
 if(request.type==='homeostatic/configuration')return request.section==='delivery'?structuredClone(delivery):{revision:'fixture',settings:structuredClone(saved),rules:[],monitoring_policy_templates:[],alerts:{notifications:false,consumer:null,policy:saved.policy},monitoring_policy_version:1};
 if(request.type==='homeostatic/save_settings'){saved=structuredClone(request.settings);return {saved:true};}
 throw Error('Unused fixture request');
}};
card.setConfig({view:'policies'});card.hass=hass;
const status=document.querySelector('#status');
function assert(condition,message){if(!condition)throw Error(message);}
function click(selector){const element=card.shadowRoot.querySelector(selector);assert(element,'Missing control: '+selector);element.click();}
function set(selector,value){const element=card.shadowRoot.querySelector(selector);assert(element,'Missing input: '+selector);element.value=value;element.dispatchEvent(new Event('input',{bubbles:true,composed:true}));}
document.querySelector('#checks').onclick=async()=>{
 try{
  assert(!requests.some(request=>request.section==='delivery'),'Policy list discovered destinations');
  click('[data-definition-action="edit"][data-definition-kind="policies"]');
  set('[data-definition-kind="policies"][data-definition-field="name"]','Edited integration policy');
  click('[data-definition-action="new-policy-method"]');
  await Promise.resolve();await Promise.resolve();
  const id=card.policyMethodEditor.id;
  set('.delivery-method-editor [data-definition-field="name"]','Kitchen voice');
  click('[data-definition-action="destination-open"]');
  const type=card.shadowRoot.querySelector('[data-definition-delivery-type]');type.value='voice';type.dispatchEvent(new Event('change',{bubbles:true,composed:true}));
  click('[data-definition-action="destination-add"][data-destination-channel="satellite:kitchen"]');
  click('[data-definition-action="use-policy-method"]');
  assert(card.page==='policies'&&card.definitionSelection.id===policy.id,'Lost selected policy');
  assert(card.settingsDraft.monitoring_policies[0].name==='Edited integration policy','Lost policy name');
  assert(card.settingsDraft.monitoring_policies[0].notifications[0].methods.includes(id),'New method not selected');
  click('[data-action="save-source-settings"]');
  await Promise.resolve();await Promise.resolve();await Promise.resolve();
  assert(saved.monitoring_policies[0].name==='Edited integration policy','Policy edit not saved');
  assert(saved.notification_definitions.methods[id].name==='Kitchen voice','Method not saved together');
  assert(requests.filter(request=>request.type==='homeostatic/save_settings').length===1,'Expected one complete save');
  status.textContent='PASS: policy list loads without delivery discovery; method editing returns to the policy; one save applies both drafts.';
 }catch(error){status.textContent='FAIL: '+error.message;console.error(error);}
};
</script></body></html>
