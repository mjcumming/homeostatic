<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Policy picker · isolated workflow</title>
<style>
:root{--primary-text-color:#182a34;--primary-background-color:#f5f7f8;--card-background-color:#fff;--secondary-background-color:#edf2f5;--secondary-text-color:#546875;--divider-color:#dce4e9;--primary-color:#007eab;--text-primary-color:#fff}:root[data-theme="dark"]{--primary-text-color:#e4e8ec;--secondary-text-color:#aab8c5;--primary-background-color:#10171e;--card-background-color:#18232d;--secondary-background-color:#263744;--divider-color:#41505c;--primary-color:#57c5ef;color-scheme:dark}body{margin:0;font:16px Arial,sans-serif;background:var(--primary-background-color);color:var(--primary-text-color)}#controls{padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--divider-color)}button,select{font:inherit;min-height:44px}button{padding:8px}#feedback{margin:12px;overflow-wrap:anywhere}homeostatic-card{display:block;max-width:1100px;margin:auto}body>details{padding:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere}
</style></head><body>
<div id="controls"><strong>Synthetic policies</strong><button id="show">Show entity list</button><button id="run">Run list checks</button><label><input type="checkbox" id="dark">Dark theme</label></div>
<p id="feedback" role="status">Review at 320px, 390px and desktop widths. This fixture uses synthetic equipment and never contacts Home Assistant.</p>
<homeostatic-card></homeostatic-card>
<details><summary>Machine-readable acceptance receipt</summary><pre id="receipt"></pre></details>
<details><summary>Mock saved settings</summary><pre id="saved-state"></pre></details>
<script type="module" src="./policy-picker-scenario.mjs"></script></body></html>
