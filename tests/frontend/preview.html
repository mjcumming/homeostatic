<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Homeostatic component test</title>
  <style>
    :root{--primary-text-color:#182a34;--primary-background-color:#f5f7f8;--card-background-color:#fff;--secondary-background-color:#edf2f5;--secondary-text-color:#546875;--divider-color:#dce4e9;--primary-color:#007eab;--text-primary-color:#fff}
    body{margin:0;font:14px Arial,sans-serif}#controls{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #ddd}button,select{padding:8px;font:inherit}homeostatic-card,homeostatic-panel{max-width:1100px;margin:auto}
  </style>
</head>
<body>
  <div id="controls"><strong>Component test · synthetic data</strong><label>State <select id="scenario"><option value="device">Front Porch reading unknown</option><option value="light">Light unavailable</option><option value="occupancy">Occupancy sensor unavailable</option><option value="entity-recovery">Light recovering</option><option value="entity-unknown">Light state unknown</option><option value="failure">Shared failure</option><option value="setup">Setup: no reported cause</option><option value="cause">Setup: reported sign-in error</option><option value="auth">Sign-in requested</option><option value="retry">NuHeat timeout</option><option value="receiver">Receiver timeout</option><option value="starting">Retry in progress</option><option value="recovering">Awaiting recovery confirmation</option><option value="disabled">Disabled integration</option><option value="healthy">Healthy</option><option value="unknown">Unknown requirement</option><option value="disconnected">Disconnected</option><option value="unloaded">Integration unloaded</option></select></label><label><input id="dark" type="checkbox"> Dark theme</label><label><input id="unsafe" type="checkbox"> HTML-like source names</label><label><input id="admin" type="checkbox" checked> Administrator</label><button type="button" id="entity-check">Run entity regression</button><button type="button" id="menu-check">Run menu regression</button><button type="button" id="navigation-check">Run navigation regression</button><button type="button" id="live-navigation-check">Run live update regression</button><button type="button" id="scroll-panel-check">Open scrolling panel</button><button type="button" id="page-check">Run page map regression</button><button type="button" id="house-check">Run house layout regression</button><button type="button" id="problem-check">Run problem regression</button><span id="feedback" role="status"></span></div>
  <homeostatic-panel></homeostatic-panel>
  <script type="module">
    import "../../custom_components/homeostatic/frontend/homeostatic.js";
    const card=document.querySelector("homeostatic-panel");
    const scenario=document.querySelector("#scenario");
    const unsafe=document.querySelector("#unsafe");
    const admin=document.querySelector("#admin");
    const handlers=new Map();
    let subscribed;
    const connection={
      addEventListener(name,fn){handlers.set(name,fn);},
      removeEventListener(name,fn){if(handlers.get(name)===fn)handlers.delete(name);},
      async subscribeMessage(fn){subscribed=fn;queueMicrotask(()=>fn(data()));return ()=>{subscribed=null;};},
    };
    const baseSource=(node_id,name,kind,extra={})=>({
      node_id,name,kind,requirements:[],attributes:{},attached_by:["passive_availability"],
      excluded_by:[],watched:true,entity_id:null,entry_id:null,owner_id:null,...extra,
    });
    function entityData(){
      const sensor=scenario.value==="occupancy",recovering=scenario.value==="entity-recovery",unknown=scenario.value==="entity-unknown";
      const source=baseSource("entity:closet",unsafe.checked?'<img src=x onerror="alert(1)">':sensor?"Hallway":"Closet","entity",{
        entity_id:sensor?"binary_sensor.hallway":"light.closet",owner_id:"matter",
        attributes:{domain:[sensor?"binary_sensor":"light"],device_class:sensor?["occupancy"]:[],device:["demo-device"],area:["upstairs"]}});
      const owner=baseSource("entry:matter","Matter","integration",{entry_id:"matter",attributes:{domain:["matter"]}});
      const findings=recovering?[]:[{node_id:source.node_id,reason:unknown?"state_unknown":"unavailable",status:unknown?"unknown":"fail"}];
      const readiness={answer:recovering?"ready":unknown?"unknown":"blocked",nodes:[]};
      const status={current:{reason:recovering?"available":unknown?"state_unknown":"unavailable"},explanation:{findings,nodes:[]},readiness};
      return {schema_version:1,available:true,entry_id:"demo",updated_at:"2026-09-25T15:52:00Z",readiness,functions:[],evidence_gaps:unknown?1:0,
        inventory:{nodes:[source,owner],entity_status:{[source.node_id]:status},integration_evidence:{},catalog:{watched:2,candidates:[source,owner]},
          episodes:[{episode_id:"entity-episode",anchor:source.node_id,status:"fail",importance:"normal",impact:[],reasons:[{node_id:source.node_id,reason:"unavailable"}],opened_at:"2026-09-25T15:42:00Z"}],
          operator_controls:[],enrollment_changes:[],notification_requests:[]},
        coverage:{no_checks:[],never_observed:[],stale:[]},policy:{notifications_enabled:false,routes:{},episodes:[]},
        areas:[{id:"upstairs",name:"Upstairs",floor_id:null}],floors:[]};
    }
    function deviceData(){
      const device=baseSource("device:porch","Front Porch","device",{attributes:{device:["porch"],integration_domain:["matter"]},availability_entities:["sensor.porch_status","sensor.porch_temperature"]});
      const owner=baseSource("entry:matter","Matter","integration",{entry_id:"matter",attributes:{domain:["matter"]}});
      const episode={episode_id:"device-episode",anchor:device.node_id,status:"unknown",importance:"normal",impact:[],reasons:[],opened_at:"2026-09-28T12:31:14Z"};
      return{schema_version:1,available:true,entry_id:"demo",updated_at:"2026-09-28T12:34:00Z",readiness:{answer:"unknown",nodes:[]},functions:[],evidence_gaps:1,
        inventory:{nodes:[device,owner],entity_status:{[device.node_id]:{current:{reason:"incomplete_evidence"}}},integration_evidence:{},catalog:{watched:2,candidates:[device,owner]},episodes:[episode],operator_controls:[],enrollment_changes:[],notification_requests:[]},
        coverage:{no_checks:[],never_observed:[],stale:[]},policy:{notifications_enabled:false,routes:{},episodes:[]},areas:[],floors:[]};
    }
    function data(){
      if(scenario.value==="device")return deviceData();
      if(["light","occupancy","entity-recovery","entity-unknown"].includes(scenario.value))return entityData();
      if(scenario.value==="unloaded")return{schema_version:1,available:false,updated_at:"2026-09-25T15:52:00Z",error:null};
      const integrationExample=["setup","cause","auth","retry","receiver","starting","recovering","disabled"].includes(scenario.value);
      const failing=scenario.value==="failure"||integrationExample,unknown=scenario.value==="unknown";
      const name=unsafe.checked?'<img src=x onerror="alert(1)"> Frigate':scenario.value==="disabled"?"mike@4831.com":scenario.value==="receiver"?"Home Theater":integrationExample?"Master Bathroom":"Frigate integration";
      const entry=baseSource("entry:frigate",name,"integration",{entry_id:"frigate",disabled:scenario.value==="disabled",attributes:{domain:[scenario.value==="receiver"?"denonavr":integrationExample?"nuheat":"frigate"]}});
      const sensor=baseSource("entity:person","Basement person sensor","entity",{entity_id:"binary_sensor.person",owner_id:"frigate",attributes:{area:["basement"]}});
      const fn=baseSource("function:lighting","Basement motion lighting","function",{requirements:["entity:person"],watched:false});
      const unwatched=baseSource("entity:excluded","Workshop test sensor","entity",{watched:false,excluded_by:["ignore_workbench"]});
      const answer=["starting","disabled"].includes(scenario.value)?"unknown":scenario.value==="recovering"?"ready":failing?"blocked":unknown?"unknown":"ready";
      const reason={auth:"auth_required",retry:"setup_retry",receiver:"setup_retry",starting:"setup_in_progress",recovering:"loaded",healthy:"loaded",disabled:"disabled"}[scenario.value]??"setup_error";
      const detail={auth:"Session expired",cause:"Unable to sign in to provider",retry:"HTTPSConnectionPool: /api/authenticate/user (Caused by ConnectTimeoutError: Connection timed out)",receiver:"TimeoutException for http://192.0.2.15/status.xml"}[scenario.value]??reason.replaceAll("_"," ");
      const current={reason,message:detail,observed_at:"2026-09-25T15:52:00Z"};
      const last_failure=scenario.value==="starting"?{reason:"setup_retry",message:"Connection timed out",observed_at:"2026-09-25T15:42:00Z"}:null;
      const evidence={current,last_failure};
      const reasons=["starting","recovering"].includes(scenario.value)?[]:failing?[{node_id:entry.node_id,reason:scenario.value==="disabled"?"stale":reason,message:name+": "+detail,status:scenario.value==="disabled"?"unknown":"fail"}]:[];
      const episode={episode_id:"demo-episode",anchor:"entry:frigate",status:"fail",importance:"high",impact:integrationExample?[]:["entity:person","function:lighting"],recorded:["entity:person"],opened_at:"2026-09-25T15:42:00Z",reasons};
      const nodes=[entry,sensor,fn];
      const readiness={answer,nodes:failing?[{node_id:"entry:frigate",own:"fail",watched:true,reasons:["setup_error"]}]:unknown?[{node_id:"entity:person",own:"unknown",watched:true,reasons:["state_unknown"]}]:[]};
      return{schema_version:1,available:true,entry_id:"demo",updated_at:"2026-09-25T15:52:00Z",readiness,
        functions:[{...fn,readiness}],evidence_gaps:unknown?1:0,
        inventory:{nodes,integration_evidence:integrationExample||scenario.value==="healthy"?{[entry.node_id]:evidence}:{},catalog:{watched:2,candidates:[entry,sensor,unwatched]},episodes:failing?[episode]:[],operator_controls:[],enrollment_changes:[],notification_requests:[]},
        coverage:{no_checks:["function:lighting"],never_observed:unknown?[{node_id:"entity:person",check_id:"availability"}]:[],stale:[],notification_consumer_missing:false},
        policy:{notifications_enabled:false,routes:{owner:["phone"]},episodes:[]},
        areas:[{id:"basement",name:"Basement",floor_id:"lower"}],floors:[{id:"lower",name:"Lower floor"}]};
    }
    let savedAlerts={notifications:false,consumer:null};
    const hass={connection,localize(key){return key==="component.matter.title"?"Matter":key==="component.nuheat.title"?"NuHeat":key==="component.frigate.title"?"Frigate":key==="component.denonavr.title"?"Denon AVR":null;},user:{id:"demo",is_admin:true},async callWS({node_id,type,notifications,consumer}){
      if(type==="homeostatic/configuration")return{revision:1,rules:[],alerts:{...savedAlerts,consumer_state:savedAlerts.consumer?"on":null,policy:{timezone:"America/Chicago",recipients:{owner:{channels:["event"]}},digests:{},rules:[{loudness:"notify"}]}},consumers:[{entity_id:"automation.homeostatic_alerts",name:"Homeostatic alerts",state:"on"}]};
      if(type==="homeostatic/preview_alerts")return{preview_token:"demo-preview",notifications,consumer,activating:notifications&&!savedAlerts.notifications,open_problems:data().inventory.episodes.length,requests_now:notifications?1:0,next_deadline:null};
      if(type==="homeostatic/save_alerts"){savedAlerts={notifications,consumer};return{saved:true};}
       const current=data(),source=current.inventory?.nodes.find(item=>item.node_id===node_id);
       if(!source)throw{message:"This capability is no longer monitored"};
       if(source.kind==="device")return{source,entity_status:current.inventory.entity_status[node_id],device_evidence:{total:2,reporting_count:1,members:[{node_id:"entity:porch_status",name:"Front Porch Review Status",state:"unknown",restored:false},{node_id:"entity:porch_temperature",name:"Front Porch Temperature",state:"72",restored:false}]},explanation:{findings:[],nodes:[]},readiness:current.readiness,impact:{nodes:[]}};
      if(current.inventory.entity_status?.[node_id])return{source,entity_status:current.inventory.entity_status[node_id],...current.inventory.entity_status[node_id],impact:{nodes:[]},updated_at:current.updated_at};
      return{source,integration_evidence:current.inventory.integration_evidence[node_id],readiness:current.readiness,updated_at:current.updated_at,
        explanation:{findings:current.inventory.episodes[0]?.reasons??[],nodes:source.kind==="function"?current.readiness.nodes:[]},
        impact:{nodes:current.inventory.nodes.filter(n=>n.node_id!==node_id).map(n=>({node_id:n.node_id,importance:"normal"}))}};
    }};
    card.setConfig({view:"overview"});
    card.hass=hass;
    function change(){
      if(scenario.value==="disconnected"){handlers.get("disconnected")?.();return;}
      handlers.get("ready")?.();subscribed?.(data());
    }
    document.querySelector("#dark").addEventListener("change",event=>{
      const colors=event.target.checked?{"primary-text-color":"#e1e1e1","primary-background-color":"#111111","card-background-color":"#1c1c1c","divider-color":"#383838","secondary-text-color":"#b5b5b5","secondary-background-color":"#282828","primary-color":"#03a9f4"}:{};
      for(const name of ["primary-text-color","primary-background-color","card-background-color","divider-color","secondary-text-color","secondary-background-color","primary-color"]){
        if(colors[name])card.style.setProperty(`--${name}`,colors[name]);else card.style.removeProperty(`--${name}`);
      }
    });
    scenario.addEventListener("change",change);
    unsafe.addEventListener("change",change);
    admin.addEventListener("change",()=>{
      card.hass={...hass,user:{id:admin.checked?"demo":"viewer",is_admin:admin.checked}};
    });
    document.querySelector("#navigation-check").addEventListener("click",()=>{
      const feedback=document.querySelector("#feedback");
      const expect=(condition,message)=>{if(!condition)throw new Error(message);};
      try {
        card.setConfig({view:"overview",navigation:false});
        expect(card.shadowRoot.querySelector(".nav").hidden,"Embedded page tabs should be hidden");
        card.shadowRoot.querySelector('main [data-page="coverage"]').click();
        expect(card.shadowRoot.querySelector("h1").textContent==="Monitoring","Monitoring drill-down should open");
        const back=card.shadowRoot.querySelector('[data-action="back"]');
        expect(!back.hidden && back.textContent.includes("Overview"),"A return to Overview must be available");
        back.click();
        expect(card.shadowRoot.querySelector("h1").textContent==="Overview","Return should restore Overview");
        expect(back.hidden,"The return button should disappear at the configured view");
        feedback.textContent="PASS: embedded Monitoring drill-down returns to Overview";
      } catch(error) {feedback.textContent="FAIL: "+error.message;}
    });
    document.querySelector("#live-navigation-check").addEventListener("click",async()=>{
      const feedback=document.querySelector("#feedback");
      const expect=(condition,message)=>{if(!condition)throw new Error(message);};
      try {
        scenario.value="healthy";change();card.setConfig({view:"house"});
        const root=card.shadowRoot,main=root.querySelector("main");
        main.style.height="220px";main.style.overflow="auto";
        root.querySelector(".house-inventory").open=true;
        root.querySelector(".house-signals").open=true;
        root.querySelector(".house-inventory > summary").focus();
        main.scrollTop=100;
        const previousScroll=main.scrollTop;
        subscribed?.({...data(),updated_at:"2026-09-25T15:53:00Z"});
        expect(root.querySelector("h1").textContent==="Explore","Live update should keep the current page");
        expect(root.querySelector(".house-inventory").open && root.querySelector(".house-signals").open,"Live update should keep nested menus open");
        expect(root.activeElement===root.querySelector(".house-inventory > summary"),"Live update should keep menu focus");
        expect(main.scrollTop===previousScroll,"Live update should keep the reading position");
        handlers.get("disconnected")?.();
        expect(root.querySelector(".banner")?.textContent.includes("Connection lost"),"Disconnect should show current status as unavailable");
        handlers.get("ready")?.();subscribed?.(data());
        expect(root.querySelector(".house-inventory").open && root.querySelector(".house-signals").open,"Reconnect should restore open menus");
        expect(main.scrollTop===previousScroll,"Reconnect should restore the reading position");
        main.style.height="";main.style.overflow="";
        root.querySelector('.nav [data-page="coverage"]').click();
        const search=root.querySelector("[data-coverage-search]");
        search.value="Frigate";search.dispatchEvent(new Event("input",{bubbles:true,composed:true}));
        const focused=root.querySelector("[data-coverage-search]");
        focused.focus();focused.setSelectionRange(3,3);
        subscribed?.({...data(),updated_at:"2026-09-25T15:54:00Z"});
        expect(root.activeElement===root.querySelector("[data-coverage-search]"),"Live update should keep search focus");
        expect(root.activeElement.value==="Frigate" && root.activeElement.selectionStart===3,"Live update should keep search text and cursor");
        root.querySelector('.nav [data-page="configuration"]').click();
        await Promise.resolve();await Promise.resolve();
        const rail=root.querySelector(".config-rail");
        expect(rail,"Settings should have a scrollable navigation rail");
        const railStyle=document.createElement("style");
        railStyle.textContent=".config-rail{max-height:100px!important;overflow:auto!important}";
        root.append(railStyle);
        rail.scrollTop=60;
        const railScroll=rail.scrollTop;
        expect(railScroll>0,"Settings rail should have a reading position to retain");
        subscribed?.({...data(),updated_at:"2026-09-25T15:55:00Z"});
        expect(root.querySelector(".config-rail").scrollTop===railScroll,"Live update should keep Settings rail position");
        railStyle.remove();
        feedback.textContent="PASS: live updates and reconnect keep menus, position and focus";
      } catch(error) {feedback.textContent="FAIL: "+error.message;}
    });
    document.querySelector("#scroll-panel-check").addEventListener("click",async()=>{
      const feedback=document.querySelector("#feedback");
      scenario.value="retry";change();card.setConfig({view:"overview"});
      card.openDetail({episodeId:"demo-episode"});await card.loadDetail();
      const body=card.dialog.querySelector(".dialog-body");
      body.insertAdjacentHTML("beforeend",Array.from({length:60},(_,index)=>`<p>Scroll test row ${index+1}</p>`).join(""));
      if(!document.querySelector("#scroll-test-spacer")){
        const spacer=document.createElement("div");spacer.id="scroll-test-spacer";spacer.style.height="1600px";document.body.append(spacer);
      }
      card.dialog.addEventListener("close",()=>document.querySelector("#scroll-test-spacer")?.remove(),{once:true});
      window.scrollTo(0,120);
      feedback.textContent=getComputedStyle(card.dialog).overscrollBehaviorY==="contain"&&card.dialog.scrollHeight>card.dialog.clientHeight
        ? "READY: scroll to both ends inside the panel; the dashboard should stay put"
        : "FAIL: dialog is not a contained scrolling surface";
    });
    document.querySelector("#page-check").addEventListener("click",async()=>{
      const feedback=document.querySelector("#feedback");
      const expect=(condition,message)=>{if(!condition)throw new Error(message);};
      try {
        scenario.value="disabled";change();card.setConfig({view:"overview"});
        const root=card.shadowRoot;
        const labels=[...root.querySelectorAll(".nav button")].map(button=>button.textContent);
        expect(labels.join("|")==="Overview|Issues|Explore|Monitoring|History|Settings","Six destinations should have clear jobs");
        expect(root.querySelector("h1").textContent==="Overview" && root.querySelectorAll(".overview-stat").length===4,"Overview should show global counts");
        expect(root.querySelectorAll(".issue-row").length===1 && root.querySelector(".issues-panel").textContent.includes("1 open"),"Overview should show a recent issue and the total");
        root.querySelector('.nav [data-page="problems"]').click();
        expect(root.querySelector("h1").textContent==="Issues" && root.querySelectorAll(".issue-row").length===1,"Issues should hold the full open list");
        const four=data();
        const first=four.inventory.episodes[0];
        four.inventory.episodes=[
          {...first,episode_id:"old-critical",importance:"critical",opened_at:"2026-09-25T10:00:00Z"},
          {...first,episode_id:"new-low",importance:"low",opened_at:"2026-09-25T11:00:00Z"},
          {...first,episode_id:"new-high",importance:"high",opened_at:"2026-09-25T12:00:00Z"},
          {...first,episode_id:"new-normal",importance:"normal",opened_at:"2026-09-25T13:00:00Z"},
        ];
        card.current={status:"current",data:four,error:null};card.page="overview";card.render();
        expect(root.querySelector(".overview-stat strong").textContent==="4" && root.querySelectorAll(".issue-row").length===3,"Overview should count all four and show the newest three");
        expect(!root.querySelector('[data-episode="old-critical"]') && root.querySelector('[data-episode="new-low"]'),"Recency should control the Overview preview");
        root.querySelector('.nav [data-page="problems"]').click();
        expect(root.querySelectorAll(".issue-row").length===4 && root.querySelector(".issue-row [data-episode]").dataset.episode==="old-critical","Issues should retain all four in importance order");
        scenario.value="disabled";change();
        root.querySelector('.nav [data-page="coverage"]').click();
        expect(root.querySelector("h1").textContent==="Monitoring","Monitoring should have its own page");
        expect(root.querySelector(".monitoring-lead").textContent.includes("selected for HA checks"),"Monitoring should state what is checked");
        expect(root.querySelector(".coverage-attention .is-disabled") && root.querySelector(".monitoring-discovery").textContent.includes("not selected"),"Disabled evidence and unselected scope must stay distinct");
        expect(root.querySelector(".coverage-attention").textContent.includes("NuHeat · mike@4831.com"),"Account-named connections should show their integration first");
        expect(root.querySelector('.coverage-attention a[href="/config/integrations/integration/nuheat#config_entry=frigate"]'),"Disabled integration should open its exact HA connection");
        root.querySelector('.nav [data-page="history"]').click();
        expect(root.querySelector("h1").textContent==="History" && root.querySelector("h2").textContent==="Resolved problems" && !root.querySelector(".history-monitoring"),"History should show resolved problems without runtime monitoring changes");
        root.querySelector('.nav [data-page="configuration"]').click();
        expect(root.querySelector("h1").textContent==="Settings" && root.querySelectorAll(".settings-nav button").length===2,"Settings should show working controls");
        root.querySelector('[data-settings-section="alerts"]').click();
        await new Promise(resolve=>setTimeout(resolve,0));
        expect(root.querySelector("main").textContent.includes("Requests are currently off"),"Saved alert state should be explicit");
        expect(root.querySelector('a[href="/config/integrations/integration/homeostatic#config_entry=demo"]'),"Native options should open Homeostatic directly");
        const toggle=root.querySelector('[data-alert-field="notifications"]');
        toggle.checked=true;toggle.dispatchEvent(new Event("change",{bubbles:true}));
        const consumer=root.querySelector('[data-alert-field="consumer"]');
        consumer.value="automation.homeostatic_alerts";consumer.dispatchEvent(new Event("change",{bubbles:true}));
        root.querySelector('[data-action="preview-alerts"]').click();
        await new Promise(resolve=>setTimeout(resolve,0));
        expect(root.querySelector(".config-preview") && !root.querySelector('[data-action="save-alerts"]').disabled,"Preview should permit saving exact changes");
        root.querySelector('[data-action="save-alerts"]').click();
        await new Promise(resolve=>setTimeout(resolve,0));
        expect(root.querySelector("main").textContent.includes("Requests are currently on"),"Saved settings should refresh");
        scenario.value="healthy";change();card.setConfig({view:"overview"});
        const empty=data();empty.inventory.episodes=[];empty.functions=[];
        card.current={status:"current",data:empty,error:null};card.render();
        expect(root.querySelector(".overview-stat strong").textContent==="0" && root.querySelectorAll(".issue-row").length===0,"Overview should show the empty issue state");
        expect(root.querySelectorAll(".overview-stat strong")[1].textContent==="Not configured","No functions should not read as all ready");
        scenario.value="healthy";change();
        feedback.textContent="PASS: six-page map, overview counts, issues, and monitoring distinctions";
      } catch(error) {feedback.textContent="FAIL: "+error.message;}
    });
    document.querySelector("#house-check").addEventListener("click",()=>{
      const feedback=document.querySelector("#feedback");
      const expect=(condition,message)=>{if(!condition)throw new Error(message);};
      try {
        scenario.value="healthy";change();
        card.setConfig({view:"house",navigation:false});
        const root=card.shadowRoot;
        const house=root.querySelector(".house");
        const rail=root.querySelector(".locations");
        const name=root.querySelector(".location-name");
        const count=root.querySelector(".location-count");
        const handle=root.querySelector(".rail-resizer");
        expect(house && rail && name && count && handle,"House should show locations, counts, and a resize handle");
        expect(count.getBoundingClientRect().top>=name.getBoundingClientRect().bottom,"Counts should appear below names");
        expect(rail.getBoundingClientRect().width>=300,"Location rail should be wide enough to read");
        handle.dispatchEvent(new KeyboardEvent("keydown",{key:"Home",bubbles:true,composed:true}));
        const narrow=Number(handle.getAttribute("aria-valuenow"));
        handle.dispatchEvent(new KeyboardEvent("keydown",{key:"ArrowRight",bubbles:true,composed:true}));
        expect(Number(handle.getAttribute("aria-valuenow"))>narrow,"Location rail should resize by keyboard");
        expect(localStorage.getItem("homeostatic-house-rail-width")===handle.getAttribute("aria-valuenow"),"Rail width should be remembered");
        expect(house.querySelector(".stack .panel").getBoundingClientRect().height<500,"Short location details should not stretch down the page");
        expect(house.querySelector(".house-summary")?.textContent.includes("monitored source"),"Location should lead with monitoring context");
        const inventory=house.querySelector(".house-inventory");
        expect(inventory && !inventory.open,"Discovered entities should start collapsed");
        inventory.open=true;
        expect(inventory.querySelector(".house-source") && !inventory.textContent.includes("Rule provenance"),"Expanded inventory should use readable source rows without rule columns");
        const sourceLink=inventory.querySelector("[data-coverage-source]");
        sourceLink.click();
        expect(root.querySelector("h1").textContent==="Monitoring" && root.querySelector(".panel-head h2").textContent.includes("Selected sources"),"Source should open scoped Monitoring");
        const back=root.querySelector('[data-action="back"]');
        expect(!back.hidden && back.textContent.includes("Basement in Explore"),"Return should name the selected location");
        back.click();
        expect(root.querySelector(".stack .panel-head h2").textContent==="Basement" && root.querySelector(".house-inventory").open,"Return should restore the location and inventory disclosure");
        root.querySelector("[data-location-coverage]").click();
        expect(root.querySelector(".panel-head h2").textContent.includes("Basement sources"),"Location review should show only the selected location");
        root.querySelector('[data-action="clear-coverage-search"]').click();
        expect(root.querySelector(".panel-head h2").textContent.includes("Watched sources"),"Show all monitoring should remove source selection");
        const empty=data();
        empty.functions=[];
        empty.inventory.nodes=empty.inventory.nodes.filter(item=>item.kind!=="function").map(item=>item.kind==="entity"?{...item,watched:false,attached_by:[]}:item);
        empty.inventory.catalog.candidates=empty.inventory.catalog.candidates.map(item=>item.kind==="entity"?{...item,watched:false,attached_by:[]}:item);
        empty.inventory.episodes=[];
        subscribed?.(empty);
        card.setConfig({view:"house"});
        expect(root.querySelector(".house-summary").textContent.includes("no monitoring or defined home functions for Basement"),"An unassessed location needs one plain explanation");
        expect(!root.querySelector(".house-functions-note")&&!root.querySelector('.house a[href="/config/integrations"]'),"Empty Explore should not show a function card or generic integration link");
        expect(!root.querySelector(".house-summary-actions button"),"Unselected inventory alone should not urge monitoring changes");
        expect(root.querySelector(".house-inventory"),"The discovered inventory remains available");
        expect(sessionStorage.getItem("homeostatic-explore-location")==="area:basement","Selected area should survive a return to Explore");
        expect(new (card.constructor)().location==="area:basement","A new Explore card should restore the selected area after a native tab change");
        scenario.value="failure";change();card.setConfig({view:"house"});
        expect(card.shadowRoot.querySelector(".house-findings")?.textContent.includes("Open problems"),"Linked problem should appear before inventory");
        scenario.value="unknown";change();
        expect(card.shadowRoot.querySelector(".house-findings")?.textContent.includes("Awaiting first observation"),"Monitored evidence gap should appear before inventory");
        scenario.value="healthy";change();
        feedback.textContent="PASS: house layout, location findings, collapsed inventory, and coverage navigation";
      } catch(error) {feedback.textContent="FAIL: "+error.message;}
    });
    document.querySelector("#problem-check").addEventListener("click",async()=>{
      const feedback=document.querySelector("#feedback");
      const expect=(condition,message)=>{if(!condition)throw new Error(message);};
      try {
        card.setConfig({view:"overview"});
        scenario.value="retry";change();
        card.openDetail({episodeId:"demo-episode"});await card.loadDetail();
        const body=card.shadowRoot.querySelector(".dialog-body");
        expect(body.innerText.includes("NuHeat connection timed out"),"Cloud timeout should have a plain headline");
        expect(body.innerText.includes("Try the NuHeat app"),"Cloud timeout needs a useful app check");
        expect(!body.innerText.includes("HTTPSConnectionPool")&&!card.main.innerText.includes("HTTPSConnectionPool"),"Raw error must not lead either view");
        expect(!body.innerText.includes("policy")&&!body.innerText.includes("Notification events")&&!body.innerText.includes("No home functions"),"Internal explanations must not lead the problem");
        expect(body.querySelectorAll(".next-action a.primary").length===1,"One primary next action");
        expect([...body.querySelectorAll("details")].every(item=>!item.open),"Diagnostics start collapsed");
        expect(body.innerText.includes("Pause alerts")&&!body.querySelector('[data-shelf]').closest("details"),"Pause alerts is directly available");
        expect(!body.querySelector('[data-maintenance]')&&!body.querySelector('[data-disclosure="manage"]'),"Problem controls stay scoped to this problem without a management disclosure");
        expect(!body.innerText.includes("Copy diagnostic data")&&!body.innerText.includes("View raw data"),"Diagnostic actions stay inside Technical details");
        expect(!body.innerText.includes("What is affected"),"Do not invent household impact");
        expect(!body.querySelector(".evidence-overview")&&!body.innerText.includes("What you can do"),"Open problems omit generic evidence rows and extra headings");
        expect(body.querySelector(".problem-progress").textContent.startsWith("Open since"),"Problem age remains visible once");
        scenario.value="receiver";change();await card.loadDetail();
        expect(body.innerText.includes("Receiver connection timed out")&&body.innerText.includes("powered on"),"Receiver timeout needs local power/network guidance");
        expect(!body.querySelector(".problem-brief").innerText.includes("Denon AVR"),"Integration name is not repeated inside its brief");
        expect(body.querySelector(".problem-brief").innerText.split("Home Assistant will try again automatically.").length===2,"Retry status appears once in receiver details");
        expect(!body.innerText.includes("NuHeat app"),"Provider guidance must stay scoped");
        scenario.value="auth";change();await card.loadDetail();
        expect(body.innerText.includes("Sign-in required"),"HA reauthentication should request sign-in");
        expect(body.querySelector(".next-action a").textContent==="Sign in again","Sign-in action label should be explicit");
        expect(body.querySelector(".next-action a").getAttribute("href")==="/config/integrations/integration/nuheat#config_entry=frigate","Sign-in must open the exact HA entry");
        scenario.value="starting";change();await card.loadDetail();
        expect(body.innerText.toLowerCase().includes("connection timed out")&&body.innerText.includes("trying again"),"Earlier cause and current retry must remain distinct");
        body.querySelector('[data-disclosure="technical"]').open=true;
        body.querySelector('[data-disclosure="diagnostics"]').open=true;
        expect(body.innerText.includes("Last reported error")&&body.innerText.includes("Connection timed out"),"Earlier error remains inspectable with its timestamp");
        subscribed?.(data());await card.loadDetail();
        expect(body.querySelector('[data-disclosure="technical"]').open&&body.querySelector('[data-disclosure="diagnostics"]').open,"Live updates preserve technical and raw data disclosures");
        const clipboardDescriptor=Object.getOwnPropertyDescriptor(navigator,"clipboard");
        let copied;
        try {
          Object.defineProperty(navigator,"clipboard",{configurable:true,value:{async writeText(value){copied=value;}}});
          body.querySelector('[data-copy-diagnostics]').click();await Promise.resolve();
          expect(JSON.parse(copied).evidence.source.node_id==="entry:frigate","Copy exports the selected source diagnostics");
          expect(body.querySelector('[data-copy-feedback]').textContent==="Diagnostic data copied.","Successful copy has feedback");
          Object.defineProperty(navigator,"clipboard",{configurable:true,value:{async writeText(){throw new Error("Denied");}}});
          body.querySelector('[data-copy-diagnostics]').click();await Promise.resolve();
          expect(body.querySelector('[data-copy-feedback]').textContent.includes("copy the text manually"),"Clipboard failure offers a raw-text fallback");
          expect(!body.querySelector('[data-copy-diagnostics]').disabled,"Copy can be retried after failure");
        } finally {
          delete navigator.clipboard;
          if(clipboardDescriptor)Object.defineProperty(navigator,"clipboard",clipboardDescriptor);
        }
        scenario.value="recovering";change();await card.loadDetail();
        expect(body.innerText.includes("Checking recovery")&&body.innerText.includes("once recovery is confirmed"),"Recovery hold cannot announce resolved");
        expect(!body.querySelector(".next-action a.primary"),"Recovery should not demand an unnecessary action");
        scenario.value="disabled";change();await card.loadDetail();
        expect(body.innerText.includes("Disabled in Home Assistant")&&card.main.querySelector(".issue-row.neutral"),"Disabled stays counted and visually quiet");
        expect(body.innerText.includes("If this is intentional"),"Do not infer intentional disablement");
        scenario.value="setup";change();await card.loadDetail();
        expect(body.innerText.includes("did not report a cause"),"Missing cause must remain honest");
        unsafe.checked=true;change();await card.loadDetail();
        expect(!body.querySelector("img")&&!card.main.querySelector("img"),"Source names remain text");
        unsafe.checked=false;scenario.value="healthy";change();await card.loadDetail();
        expect(body.textContent.includes("no longer open"),"A resolved selection refreshes");
        card.openDetail({nodeId:"entry:frigate"});await card.loadDetail();
        expect(body.innerText.includes("Connection available")&&!body.innerText.includes("Checking recovery"),"Healthy source detail must not invent an open recovery hold");
         scenario.value="retry";change();card.openDetail({episodeId:"demo-episode"});await card.loadDetail();
         body.querySelectorAll("details").forEach(item=>item.open=false);
         scenario.value="device";change();
         const single=deviceData();
         single.inventory.nodes[0].availability_entities=["sensor.porch_status"];
         single.inventory.nodes.push(baseSource("entity:porch_status","Front Porch Review Status","entity",{entity_id:"sensor.porch_status"}));
         card.current={status:"current",data:single,error:null};card.render();
         expect(card.main.querySelector(".issue-row").innerText.includes("Review Status has no current value"),"Single-member device card names the affected entity");
         expect(!card.main.querySelector(".issue-row").innerText.includes("Monitored entity availability"),"Device card omits the generic label");
         change();card.openDetail({episodeId:"device-episode"});await card.loadDetail();
         expect(card.shadowRoot.querySelector("#detail-title").textContent==="Front Porch","Device name leads the detail");
         expect(body.querySelector(".problem-brief").innerText.includes("Integration: Matter"),"Known integration appears under the device name");
         expect(body.querySelector('[data-disclosure="selected-readings"]').textContent.includes("2 selected entities"),"Complete selected count stays in the disclosure");
         expect(body.querySelector(".problem-brief").innerText.includes("Front Porch Review Status · unknown in Home Assistant"),"Entity needing review is named with its state");
         expect(!body.querySelector(".problem-brief").innerText.includes("Reporting in Home Assistant:"),"Device brief omits the redundant count");
         expect(!body.querySelector(".problem-brief").innerText.includes("Device availability isn't confirmed"),"Conclusion does not crowd out readings");
         expect(body.querySelector('.next-action a.primary[href="/config/devices/device/porch"]'),"Device page is the primary action");
         expect(!body.querySelector('[data-disclosure="selected-readings"]').open&&!body.querySelector('[data-disclosure="technical"]').open,"Other readings and technical details start collapsed");
         feedback.textContent="PASS: integration and entity problems, device reading summary, action links, disclosure state and safe content";
      } catch(error) {feedback.textContent="FAIL: "+error.message;}
    });
    document.querySelector("#entity-check").addEventListener("click",async()=>{
      const feedback=document.querySelector("#feedback");
      const expect=(ok,message)=>{if(!ok)throw new Error(message);};
      try {
        card.setConfig({view:"overview"});
        scenario.value="light";change();card.openDetail({episodeId:"entity-episode"});await card.loadDetail();
        const body=card.shadowRoot.querySelector(".dialog-body");
        expect(body.innerText.includes("Light · Upstairs · via Matter"),"Identify capability, area and provider");
        expect(body.innerText.includes("wall switch, if it has one"),"Light has a relevant first check");
        expect(card.main.innerText.includes("Light unavailable"),"Card and detail agree");
        expect(body.querySelector('a[href="/config/devices/device/demo-device"]'),"Device page is directly reachable");
        body.querySelector("[data-entity]").click();
        expect(feedback.textContent==="Entity requested: light.closet","Entity action opens native details");
        await new Promise(resolve=>card.dialog.addEventListener("close",resolve,{once:true}));
        card.openDetail({episodeId:"entity-episode"});await card.loadDetail();
        scenario.value="entity-recovery";change();await card.loadDetail();
        expect(body.innerText.includes("Checking recovery")&&card.main.innerText.includes("Checking recovery"),"Historical failure cannot override current recovery");
        scenario.value="entity-unknown";change();await card.loadDetail();
        expect(body.innerText.includes("Waiting for a known state")&&!body.innerText.includes("Checking recovery"),"Unknown evidence is not recovery");
        scenario.value="occupancy";change();await card.loadDetail();
        expect(body.innerText.includes("Occupancy sensor")&&body.innerText.includes("sensor's power or battery"),"Detection sensor has its own guidance");
        unsafe.checked=true;change();await card.loadDetail();
        expect(!body.querySelector("img")&&!card.main.querySelector("img"),"Entity names are escaped");
        unsafe.checked=false;scenario.value="light";change();await card.loadDetail();
        feedback.textContent="PASS: device identity, light/sensor guidance, current recovery and unknown evidence, native links and safe content";
      } catch(error){feedback.textContent="FAIL: "+error.message;}
    });
    card.addEventListener("hass-toggle-menu",()=>{document.querySelector("#feedback").textContent="Home Assistant menu requested (synthetic preview)";});
    document.querySelector("#menu-check").addEventListener("click",()=>{
      const feedback=document.querySelector("#feedback");
      const expect=(condition,message)=>{if(!condition)throw new Error(message);};
      const events=[];
      const listener=event=>events.push(event);
      document.addEventListener("hass-toggle-menu",listener);
      try {
        const menu=card.shadowRoot.querySelector('button[aria-label="Open Home Assistant menu"]');
        expect(menu && menu.getBoundingClientRect().width>=44 && menu.getBoundingClientRect().height>=44,"Panel menu needs an accessible touch target");
        for(const value of ["failure","disconnected","unloaded"]){
          scenario.value=value;change();menu.click();
          expect(!menu.hidden,"Menu remains available without health data");
        }
        expect(events.length===3 && events.every(event=>event.bubbles&&event.composed),"Menu event reaches the native HA shell once per click");
        const embedded=document.createElement("homeostatic-card");
        expect(!embedded.shadowRoot.querySelector(".ha-menu"),"Embedded cards use the dashboard's global menu");
        scenario.value="failure";change();
        feedback.textContent="PASS: native menu event, 44px target, disconnected/unavailable navigation and embedded card behavior";
      } catch(error) {feedback.textContent="FAIL: "+error.message;}
      finally {document.removeEventListener("hass-toggle-menu",listener);}
    });
    card.addEventListener("hass-more-info",event=>{document.querySelector("#feedback").textContent="Entity requested: "+event.detail.entityId;});
  </script>
</body>
</html>
