<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporting production component review</title>
<style>:root{--primary-text-color:#212f3b;--primary-background-color:#fafafa;--card-background-color:white;--secondary-background-color:#f1f4f6;--secondary-text-color:#536674;--divider-color:#dce2e6;--primary-color:#007eab;--text-primary-color:white}body{font:14px Arial,sans-serif;margin:0}#screen{max-width:1100px;margin:auto}nav{padding:16px;display:flex;flex-wrap:wrap;gap:16px}button{font:inherit;padding:8px}body.dark{--primary-text-color:#eee;--card-background-color:#202020;--primary-background-color:#111;--secondary-background-color:#292929;--secondary-text-color:#bbb;--divider-color:#444;background:#111;color:#eee}</style>
<nav aria-label="Component review"><strong>Synthetic data · production components</strong><button data-page="overview">Overview</button><button data-page="notifications">Notifications</button><button data-page="sources">Source settings</button><button id="theme">Dark/light</button></nav><div id="screen"></div><pre id="error"></pre>
<script type="module">
import {installationSettings,editInstallation} from "../../custom_components/homeostatic/frontend/installation-settings.mjs";
import {sourceReporting,reportingOverview,reportingChanges} from "../../custom_components/homeostatic/frontend/reporting.mjs";
import {styles} from "../../custom_components/homeostatic/frontend/styles.mjs";
const reporting={timezone:"America/Chicago",default:"weekly",people:{mike:["phone:iphone"]},profiles:{immediate:{people:["mike"]},acknowledge:{people:["mike"]},morning:{at:"08:00",people:["mike"]},evening:{at:"18:00",people:["mike"]},weekly:{at:"09:00",weekday:6,people:["mike"]}},assignments:{"device:leak":{default:"immediate",checks:{availability:"acknowledge"}}}};
const settings={reporting,simple_notifications:null,notifications:false,consumer:null,timings:{batch:30},policy:{timezone:"America/Chicago",recipients:{},rules:[]}};
const root=document.querySelector("#screen").attachShadow({mode:"open"});
const card={page:"notifications",current:{data:{entry_id:"synthetic",coverage:{},inventory:{},policy:{notifications_enabled:false,reports:[{name:"weekly",next_at:"2026-10-04T14:00:00+00:00",episodes:["leak","lamp"]}]}}},configuration:{settings:structuredClone(settings),notification_people:[{id:"mike",name:"Michael",user_id:"m",administrator:true},{id:"alex",name:"Alex",user_id:"a",administrator:false}],notification_destinations:[{channel:"phone:iphone",name:"Michael’s iPhone",user_id:"m",available:true},{channel:"phone:alex",name:"Alex’s phone",user_id:"a",available:true},{channel:"notify:email",name:"Household email",user_id:null,available:true}]},settingsDraft:settings,render(){root.innerHTML=`<style>${styles}</style>`+(this.page==="notifications"?installationSettings(this):this.page==="sources"?`<section class="panel body"><h1>Basement leak detector</h1>${sourceReporting(this,{source:{node_id:"device:leak",kind:"device"}})}</section>`:reportingOverview(this.current.data));},_hass:{config:{time_zone:"America/Chicago"},callWS:async()=>{throw Error("Tests cannot send messages.");}}};
function handle(event){if(editInstallation(card,event))return;const target=event.target.closest("button");if(target?.dataset.page){card.page=target.dataset.page;card.render();}if(target?.dataset.action==="preview-settings"){card.settingsPreview={before:card.configuration.settings,after:structuredClone(card.settingsDraft),requests_now:0,open_problems:2,reporting_assignments:Object.keys(card.settingsDraft.reporting.assignments).length};card.render();}if(target?.dataset.action==="save-settings"){card.configuration.settings=structuredClone(card.settingsDraft);card.current.data.policy.notifications_enabled=card.settingsDraft.notifications;card.settingsPreview=null;card.settingsNotice="Saved in this test page only.";card.render();}if(target?.dataset.action==="discard-settings"){card.settingsDraft=structuredClone(card.configuration.settings);card.settingsPreview=null;card.render();}}
root.addEventListener("click",handle);root.addEventListener("change",handle);document.querySelector("nav").addEventListener("click",handle);document.querySelector("#theme").onclick=()=>document.body.classList.toggle("dark");
window.addEventListener("error",e=>document.querySelector("#error").textContent=e.message);card.render();
</script></html>
