<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Named notification workflow</title>
<style>:root{--primary-text-color:#182a34;--primary-background-color:#f5f7f8;--card-background-color:#fff;--secondary-background-color:#edf2f5;--secondary-text-color:#546875;--divider-color:#dce4e9;--primary-color:#007eab;--text-primary-color:#fff}body{margin:0;font:14px Arial,sans-serif;background:var(--primary-background-color)}#controls{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--divider-color)}button{font:inherit;padding:8px}homeostatic-card{display:block;max-width:1100px;margin:auto}</style></head>
<body><div id="controls"><strong>Synthetic named notifications · no live services</strong><button id="run">Run workflow checks</button><label><input type="checkbox" id="narrow">Phone layout</label><label>Next save <select id="failure"><option value="success">Success</option><option value="reject">Reject before save</option><option value="hold">Hold until released</option><option value="hold-outage">Hold during external monitoring outage</option><option value="refresh-fail">Save then fail refresh</option><option value="lost">Apply then lose response</option><option value="conflict">Concurrent edit</option></select></label><button id="release">Release held response</button><span id="feedback" role="status"></span></div><homeostatic-card></homeostatic-card>
<details><summary>Machine-readable acceptance receipt</summary><pre id="receipt"></pre></details>
<details><summary>Mock saved settings</summary><pre id="saved-state"></pre></details><script type="module" src="./reusable-editors-scenario.mjs"></script></body></html>
