<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reusable policy editors · isolated test</title>
<style>:root{--primary-text-color:#182a34;--primary-background-color:#f5f7f8;--card-background-color:#fff;--secondary-background-color:#edf2f5;--secondary-text-color:#546875;--divider-color:#dce4e9;--primary-color:#007eab;--text-primary-color:#fff}body{margin:0;font:14px Arial,sans-serif;background:var(--primary-background-color)}#controls{padding:12px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--divider-color)}button{font:inherit;padding:8px}homeostatic-card{display:block;max-width:1300px;margin:auto}#feedback{white-space:pre-wrap}</style></head>
<body><div id="controls"><strong>Synthetic editor scenario · no live services</strong><button id="run">Run editor scenario</button><label><input type="checkbox" id="narrow">Phone layout</label><label><input type="checkbox" id="dark">Dark theme</label><span id="feedback" role="status"></span></div><homeostatic-card></homeostatic-card>
<script type="module">
import "../../custom_components/homeostatic/frontend/homeostatic.js";
import {emptyNotificationDefinitions,newMonitoringPolicy} from "../../custom_components/homeostatic/frontend/reusable-editors.mjs";
import {previewSourceSettings,saveSourceSettings} from "../../custom_components/homeostatic/frontend/source-settings.mjs";
import {monitoringExample} from "./monitoring-fixture.mjs";
const card=document.querySelector("homeostatic-card"),feedback=document.querySelector("#feedback"),data=monitoringExample();
const definitions=emptyNotificationDefinitions("America/Chicago");
definitions.methods.phone={name:"Owner phone",mode:"fixed",destinations:["phone:owner"]};
definitions.methods.email={name:"Household email",mode:"fixed",destinations:["notify:email"]};
definitions.default=[{id:"default",schedule:"morning",methods:["phone"]}];
const policy={...newMonitoringPolicy([],"thermostat"),name:"Main floor thermostat",enabled:true,match:{kind:["entity"],entity:["climate.main_floor"]},notifications:[{id:"immediate",schedule:"immediate",methods:["phone"]},{id:"report",schedule:"morning",methods:["email"]}]};
let saved={monitoring_policies:[policy],notification_definitions:definitions,timings:{settle:120,unknown_hold:900,retry_hold:120,clear_hold:120,rejoin_grace:60,startup_grace:120,startup_quiet_max:600,coalesce_count:3,coalesce_window:60,batch:30},notifications:false,consumer:null,reporting:null,simple_notifications:null,policy:{timezone:"America/Chicago",recipients:{},rules:[]}};
let revision=1,proposal=null;
const calls=[];
const configuration=()=>({revision:String(revision),rules:[],settings:structuredClone(saved),alerts:{notifications:false,consumer:null,policy:saved.policy},notification_people:[{id:"person.owner",entity_id:"person.owner",name:"Owner"},{id:"person.guest",entity_id:"person.guest",name:"Guest"}],delivery_targets:[{channel:"phone:owner",name:"Owner phone",type:"App",available:true},{channel:"notify:email",name:"Household email",type:"Email",available:true},{channel:"satellite:kitchen",name:"Kitchen assistant",type:"Voice",available:true},{channel:"tts:provider:living-room",name:"Living room speaker",type:"Voice",available:true},{channel:"sms:family:",name:"Family SMS",type:"SMS",requires_target:true,available:true}],areas:[{id:"main",name:"Main floor"}],labels:[],floors:[]});
card._hass={user:{is_admin:true},config:{time_zone:"America/Chicago"},localize:()=>null,async callWS(request){
  calls.push(structuredClone(request));
  if(request.type==="homeostatic/configuration")return configuration();
  if(request.type==="homeostatic/preview_delivery_method")return {method_id:request.method_id,name:"Synthetic saved method",targets:[{channel:"phone:owner",name:"Owner phone",type:"App",available:true}],presence:{"person.owner":{state:"not_home",restored:false}},skipped:false,preview_token:"synthetic-targets"};
  if(request.type==="homeostatic/test_delivery_method"){
    if(request.preview_token!=="synthetic-targets")throw Error("A target preview is required");
    return {requested:["phone:owner"],failed:[],skipped:false};
  }
  if(request.type==="homeostatic/preview_settings"){
    proposal=structuredClone(request.settings);
    return {before:structuredClone(saved),after:proposal,preview_token:"exact-draft",open_problems:2,requests_now:0,monitoring:{watched:3,added:[],removed:[],added_count:0,removed_count:0,functions:[],ended_issues:["old-policy-issue"]}};
  }
  if(request.type==="homeostatic/save_settings"){
    if(request.preview_token!=="exact-draft"||request.revision!==String(revision)||JSON.stringify(request.settings)!==JSON.stringify(proposal))throw Error("An exact preview is required");
    saved=structuredClone(request.settings);delete saved.rules;revision++;return {saved:true};
  }
  throw Error("Unexpected request in isolated fixture: "+request.type);
}};
card.current={status:"current",data};card.page="policies";card.configuration=configuration();card.configDraft=[];card.settingsDraft=structuredClone(saved);card.render();
document.querySelector("#narrow").onchange=event=>{card.style.width=event.target.checked?"390px":"";};
document.querySelector("#dark").onchange=event=>{document.documentElement.style.cssText=event.target.checked?"--primary-text-color:#e8ecef;--primary-background-color:#10181e;--card-background-color:#19242b;--secondary-background-color:#283740;--secondary-text-color:#b0bfc9;--divider-color:#3e4c56;--primary-color:#4abde5;--text-primary-color:#102530":"";};
window.addEventListener("error",event=>{feedback.textContent="ERROR: "+event.message;});
document.querySelector("#run").onclick=async()=>{
  const root=card.shadowRoot,expect=(value,message)=>{if(!value)throw Error(message);};
  const click=selector=>{const target=root.querySelector(selector);expect(target,"Missing control: "+selector);target.click();};
  const change=(selector,value)=>{const target=root.querySelector(selector);expect(target,"Missing field: "+selector);if(target.type==="checkbox")target.checked=value;else target.value=value;target.dispatchEvent(new Event("change",{bubbles:true,composed:true}));};
  try {
    card.page="policies";card.definitionSelection=null;card.render();
    click('[data-definition-action="duplicate"][data-definition-kind="policies"][data-definition-id="policy-1"]');
    const copy=card.settingsDraft.monitoring_policies.at(-1);
    expect(copy.enabled===false&&copy.id!=="policy-1","Copy must be independent and inactive");
    change(`[data-definition-id="${copy.id}"][data-definition-field="name"]`,"Garage thermostat");
    change(`[data-definition-id="${copy.id}"][data-definition-field="parameters:unit"]`,"°C");
    expect(copy.parameters.margin===10/9,"Unit edit must preserve deviation");
    click('[data-page="notifications"]');
    click('[data-definition-action="tab"][data-definition-kind="methods"]');
    click('[data-definition-action="duplicate"][data-definition-kind="methods"][data-definition-id="phone"]');
    const methodId=card.definitionSelection.id;
    change(`[data-definition-id="${methodId}"][data-definition-field="name"]`,"Home announcement or phone");
    change(`[data-definition-id="${methodId}"][data-definition-field="mode"]`,"home_away");
    change(`[data-definition-id="${methodId}"][data-definition-field="people"][data-person="person.owner"]`,true);
    change(`[data-definition-id="${methodId}"][data-definition-field="home"][data-destination="satellite:kitchen"]`,true);
    change(`[data-definition-id="${methodId}"][data-definition-field="away"][data-destination="phone:owner"]`,true);
    change(`[data-definition-id="${methodId}"][data-definition-field="skip"]`,true);
    click('[data-definition-action="delete"][data-definition-kind="methods"][data-definition-id="phone"]');
    expect(root.querySelector('[data-definition-action="confirm-delete"]').disabled,"Assigned deletion needs an explicit replacement");
    change('[data-definition-delete-resolution]',methodId);
    click('[data-definition-action="confirm-delete"]');
    expect(card.settingsDraft.monitoring_policies[0].notifications[0].methods[0]===methodId,"Replacement preserves assignments");
    click('[data-page="policies"]');
    expect(card.settingsDraft.monitoring_policies.at(-1).name==="Garage thermostat","Navigation retains policy draft");
    await previewSourceSettings(card);
    expect(root.textContent.includes("Monitoring ends for 1 existing issues"),"Review explains ended monitoring");
    await saveSourceSettings(card);
    expect(calls.filter(request=>request.type==="homeostatic/save_settings").length===1,"One reviewed save");
    expect(!calls.some(request=>request.type.includes("test_notification")),"Editing must never request a test message");
    expect(card.settingsDraft.notifications===false,"Requests stay off");
    click('[data-page="notifications"]');
    click('[data-definition-action="tab"][data-definition-kind="methods"]');
    click(`[data-definition-action="edit"][data-definition-kind="methods"][data-definition-id="${methodId}"]`);
    click('[data-definition-action="preview-method"]');await Promise.resolve();await Promise.resolve();
    expect(root.textContent.includes("Current destinations"),"Method preview shows exact destinations");
    click('[data-definition-action="test-method"]');await Promise.resolve();await Promise.resolve();
    expect(root.textContent.includes("1 test message requests; 0 failed requests."),"Explicit synthetic method test shows request outcome");
    feedback.textContent="PASS: copy, units, drafts, presence method, guarded deletion/save, exact target preview and explicit synthetic test. No live services.";
  }catch(error){feedback.textContent="FAIL: "+error.message;throw error;}
};
</script></body></html>
