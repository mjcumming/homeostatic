<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monitoring history preview</title>
<style>:root{--primary-text-color:#e8ecef;--primary-background-color:#111;--card-background-color:#1c1c1c;--secondary-background-color:#282828;--secondary-text-color:#aaa;--divider-color:#3e3e3e;--primary-color:#4abde5;--text-primary-color:#102530}body{margin:0;background:var(--primary-background-color);color:var(--primary-text-color);font:14px Arial,sans-serif}#controls{padding:12px;display:flex;gap:14px;flex-wrap:wrap}button{padding:8px}homeostatic-card{display:block;max-width:390px;margin:auto}</style></head>
<body><div id="controls"><strong>Synthetic MQTT history · no live connection</strong><label><input id="wide" type="checkbox"> Desktop width</label><button id="run">Run history scenario</button><span id="feedback" role="status"></span></div><homeostatic-card></homeostatic-card>
<details><summary>Machine-readable acceptance receipt</summary><pre id="receipt"></pre></details>
<script type="module">
import "../../custom_components/homeostatic/frontend/homeostatic.js";
import {sourceHistoryExample} from "./source-history-fixture.mjs";
import {notificationSettings} from "./notification-profiles-fixture.mjs";
import {sourceDetailsFixture,DEVICE_ID,ENTITY_ID} from "./source-details-fixture.mjs";
import {newMonitoringPolicy} from "../../custom_components/homeostatic/frontend/reusable-editors.mjs";
import {emptyReceipt,recordResult} from "./control-path-inventory.mjs";
const card=document.querySelector('homeostatic-card'),feedback=document.querySelector('#feedback');
let data,publish,failSource=false,failControl=false,holdControl=null,receipt,richDetails=null;
const settings=notificationSettings();
settings.monitoring_policies=[{...newMonitoringPolicy([],"device",settings.notification_definitions.profiles),id:"devices",name:"Devices"},{...newMonitoringPolicy([],"entity",settings.notification_definitions.profiles),id:"entities",name:"Entities"}];
const calls=[],listeners=new Map();
function reset(){data=sourceHistoryExample();data.inventory.attention_controls_supported=true;for(const item of data.inventory.resolved_history.episodes)item.source.owner_id='mqtt';}
reset();
const connection={addEventListener(name,handler){listeners.set(name,handler);},removeEventListener(name){listeners.delete(name);},async subscribeMessage(handler){publish=handler;queueMicrotask(()=>handler(data));return()=>{};}};
card.sourcesGrouping='integration';
card.setConfig({view:'issues'});
card.hass={connection,user:{id:'history-fixture',is_admin:true},localize:()=>null,states:{},async callWS(request){
  calls.push(structuredClone(request));
  if(request.type==='call_service'){
    if(failControl)throw Error('Synthetic control response could not be confirmed');
    if(holdControl)await holdControl.promise;
    const fields=request.service_data;
    if(request.service==='cancel_control'){
      data.inventory.operator_controls=data.inventory.operator_controls.filter(control=>control.control_id!==fields.control_id);
      return {response:{cancelled_control_id:fields.control_id}};
    }
    throw Error('Unexpected mocked service: '+request.service);
  }
  if(request.type==='homeostatic/configuration')return {revision:'1',settings:structuredClone(settings)};
  if(request.type==='topomation/locations/list')return {locations:[]};
  if(request.type==='homeostatic/source'||request.type==='homeostatic/node'){
    if(failSource&&request.type==='homeostatic/source')throw Error('Synthetic source read failed');
    const source=data.inventory.nodes.find(item=>item.node_id===request.node_id);
    const members=richDetails?(source.kind==='device'?richDetails.members:richDetails.members.filter(member=>member.node_id===source.node_id)):[];
    return {...(richDetails?{...richDetails,nodeId:source.node_id,members,total:members.length}:{}),source,readiness:{answer:'blocked',nodes:[]},explanation:{findings:data.inventory.episodes[0]?.reasons||[],nodes:[]},impact:{nodes:[]}};
  }
  throw Error('Unexpected request in isolated history fixture: '+request.type);
}};
const root=card.shadowRoot;
const flush=async()=>{for(let i=0;i<24;i++)await Promise.resolve();await new Promise(resolve=>{const channel=new MessageChannel();channel.port1.onmessage=()=>{channel.port1.close();channel.port2.close();resolve();};channel.port2.postMessage(null);});};
const expect=(value,message)=>{if(!value)throw Error(message);};
const click=async(selector,scope=root)=>{const element=scope.querySelector(selector);expect(element,`Missing rendered control: ${selector}`);expect(!element.disabled&&!element.closest('[inert]'),`Disabled control: ${selector}`);element.scrollIntoView({block:'center'});const box=element.getBoundingClientRect(),hit=root.elementFromPoint(box.x+box.width/2,box.y+box.height/2);expect(box.width>0&&box.height>0&&(hit===element||element.contains(hit)),`Hidden or covered control: ${selector}`);element.click();await flush();};
const showTree=async()=>{const back=root.querySelector('[data-action="back-sources"]');const visible=Boolean(back?.getClientRects().length);if(visible)await click('[data-action="back-sources"]');return visible;};
const openDisclosure=async selector=>{const element=root.querySelector(selector);expect(element,`Missing disclosure: ${selector}`);if(!element.open)await click('summary',element);};
const historyContent=()=>root.querySelector('.history-content:not([hidden])');
const close=async()=>{if(card.tools.dialog.open)await click('[data-tool="close"]',card.tools.dialog);if(card.dialog.open)await click('[data-action="close"]',card.dialog);};
async function mqtt(){await close();await click('[data-page="sources"]');if(card.sourcesMobileDetail&&root.querySelector('[data-action="back-sources"]'))await showTree();await click('[data-sources-select="source:entry:mqtt"]');const history=root.querySelector('a[data-sources-view="history"]');expect(history,'Selected integration has a View history destination');await click('a[data-sources-view="history"]');}
const change=async(selector,value)=>{const field=root.querySelector(selector);expect(field,`Missing field: ${selector}`);field.focus();if(field.type==='checkbox')field.checked=value;else field.value=value;field.dispatchEvent(new Event('input',{bubbles:true}));field.dispatchEvent(new Event('change',{bubbles:true}));await flush();};
function report(){document.querySelector('#receipt').textContent=JSON.stringify(receipt,null,2);parent.postMessage({type:'homeostatic-acceptance',fixture:'source-history.html',receipt},location.origin);}
document.querySelector('#wide').onchange=event=>{card.style.maxWidth=event.target.checked?'1200px':'390px';};
document.querySelector('#run').onclick=async()=>{
  receipt=emptyReceipt({fixture:'source-history.html',browser:navigator.userAgent,viewport:{width:innerWidth,height:innerHeight,card:card.getBoundingClientRect().width},data:'synthetic',destinations:'mocked'});
  feedback.textContent='Running…';document.querySelector('#run').disabled=true;
  try{
    await close();reset();richDetails=null;failSource=false;failControl=false;holdControl=null;calls.length=0;publish(data);await flush();await mqtt();
    expect(root.querySelectorAll('.source-timeline li').length===3,'Selected integration shows three retained outcomes separately from its open issue');
    expect(root.querySelectorAll('.source-related-issues [data-episode="open"]').length===1,'Current issue has one separate investigation route');
    expect(!root.querySelector('.history-information').open,'History coverage starts collapsed');
    await openDisclosure('.history-information');
    expect(root.querySelector('.history-information').innerText.includes('up to 30 days'),'Retained-history limit is visible on request');
    await click('[data-history="cleared"]');
    expect(card.page==='history'&&!card.tools.dialog.open&&root.querySelector('[data-history-toggle="cleared"]').getAttribute('aria-expanded')==='true','Source history reveals its expanded History row');
    expect(historyContent().querySelector('.history-times dt').textContent==='Observed','History labels the observed interval');
    expect(historyContent().querySelector('.history-times dd').textContent.includes('7 hr 17 min'),'Observed duration is compact');
    expect(historyContent().textContent.includes('garage relay entity as unavailable'),'Recorded evidence remains available in the retained detail');
    await click('[data-workspace-return]');expect(card.sourcesSelection==='source:entry:mqtt'&&root.querySelector('#sources-detail-title').textContent.toLowerCase()==='mqtt','Back to source retains source context');
    await click('[data-history="absorbed"]');
    expect(historyContent().textContent.includes('Recovery was not established'),'Joined problems do not claim recovery');
    expect(root.querySelector('[data-history-toggle="absorbed"]').textContent.includes('Joined another problem'),'Absorption has its own ending label');
    await click('[data-open-episode="open"]',historyContent());
    expect(card.dialog.open&&root.querySelector('#detail-title').textContent==='Porch sensor','Related problem opens the current source detail');
    expect(!card.dialog.querySelector('[data-disclosure="issue-details"]')&&!card.dialog.innerText.includes('View in Monitoring'),'Related issue has flat evidence and no circular Monitoring route');
    await close();await click('[data-page="sources"]');await showTree();
    await change('[data-sources-search]','Porch sensor');
    await click('[data-sources-select="source:device:porch"]');
    expect(root.querySelector('#sources-detail-title').textContent==='Porch sensor','Monitoring retains direct tree access to the source');
    const returnedFromMobile=await showTree();
    expect(!returnedFromMobile||root.activeElement?.dataset.sourcesSelect==='source:device:porch','Mobile Back to Monitoring returns keyboard focus to its selected tree row');
    expect(root.querySelector('[data-sources-select="source:device:porch"]').getClientRects().length,'The selected source remains reachable in the tree');
    await change('[data-sources-search]','');
    await mqtt();await click('[data-history="removed"]');
    expect(root.querySelector('[data-history-toggle="removed"]').textContent.includes('Monitoring ended'),'Removal is distinct from clearance');
    expect(root.querySelector('[data-history-toggle="removed"]').textContent.includes('Garage relay before rename'),'Historical identity remains the recorded name');
    await click('[data-workspace-return]');
    data.inventory.nodes=data.inventory.nodes.filter(source=>source.node_id!=='device:garage');
    data.inventory.catalog.candidates=data.inventory.catalog.candidates.filter(source=>source.node_id!=='device:garage');
    data.devices=data.devices.filter(device=>device.id!=='garage');
    data.updated_at='2026-09-29T12:01:00Z';publish(data);await flush();
    expect(root.querySelectorAll('.source-timeline li').length===3,'Recorded ownership preserves history after current child metadata disappears');
    await click('[data-history="removed"]');expect(root.querySelector('[data-history-toggle="removed"]').textContent.includes('Garage relay before rename'),'Removed current metadata does not erase historical name');
    listeners.get('disconnected')();await flush();
    expect(historyContent(),'Disconnected history retains its recorded evidence');
    expect(root.querySelector('main').inert&&!root.querySelector('.workspace-status').hidden,'Retained source view is visibly stale and read-only');
    publish(data);await flush();
    expect(root.querySelector('[data-history-toggle="removed"]').textContent.includes('Monitoring ended'),'Fresh subscribed data restores selected history');
    await click('[data-workspace-return]');expect(!root.querySelector('main').inert,'Fresh data restores source controls');
    failSource=true;data.updated_at='2026-09-29T12:02:00Z';publish(data);await flush();
    expect(root.querySelector('[role="alert"]')?.textContent.includes('Synthetic source read failed'),'Source read failure remains explicit');
    failSource=false;await click('[data-action="refresh-source"]');
    expect(!root.querySelector('[data-action="refresh-source"]'),'Rendered Retry reading control reloads source evidence');
    expect(root.querySelectorAll('.source-timeline li').length===3,'Retry preserves the source history');
    publish({...data,schema_version:999});await flush();await click('[data-action="retry"]');
    expect(card.current.status==='current'&&root.querySelectorAll('.source-timeline li').length===3,'Rendered Retry connection restores the source and its recorded history');
    const detail=root.querySelector('.config-detail');expect(detail.scrollWidth<=detail.clientWidth,'Source details do not overflow at the recorded fixture width');
    expect(!calls.some(call=>call.type==='call_service'||call.type==='homeostatic/save_settings'),'History and retry navigation issue no mutation requests');
    recordResult(receipt,'sources.history','pass','Clicked Monitoring, MQTT, View history and cleared/joined/removed rows; followed related issue into Monitoring and used Back with focus return. Verified recorded ownership/name after current child deletion, retention text, stale read-only/reconnect, actual Retry reading/Retry connection, no mutations and no horizontal overflow at the recorded card width.');
    await mqtt();
    try{
      expect(!root.querySelector('.config-detail [data-maintenance]'),'Integration details have no new-maintenance action');
      if(root.querySelector('[data-ui-key="source-details:source:entry:mqtt"]'))await openDisclosure('[data-ui-key="source-details:source:entry:mqtt"]');
      expect(!root.querySelector('.config-detail [data-maintenance]'),'Expanded integration details have no new-maintenance action');
      const saved={control_id:'saved-maintenance',action:'maintenance',target:'entry:mqtt',until:new Date(Date.now()+1800000).toISOString(),reason:'Replacing coordinator',include_dependents:false};
      data.inventory.operator_controls=[saved,{...saved,control_id:'other-maintenance',reason:'Separate overlapping work'}];publish(data);await flush();
      expect(root.querySelector('.config-detail').textContent.includes('Replacing coordinator')&&root.querySelector('.config-detail').textContent.includes('Until'),'Existing maintenance and its expiry remain visible');
      expect(root.querySelector('.config-detail [data-cancel-control="saved-maintenance"]')&&!root.querySelector('.config-detail [data-cancel-control="saved-maintenance"]').closest('details'),'End maintenance remains directly available');
      await click('.config-detail [data-cancel-control="saved-maintenance"]');
      expect(card.tools.dialog.querySelector('h2').textContent==='End maintenance','Existing window opens its end confirmation');
      expect(card.tools.body.textContent.includes('Other overlapping maintenance windows remain active'),'Ending maintenance explains remaining overlap');
      let before=calls.filter(call=>call.type==='call_service').length;
      await close();
      expect(calls.filter(call=>call.type==='call_service').length===before&&data.inventory.operator_controls.length===2,'Closing the confirmation preserves both windows without a mutation');
      await click('.config-detail [data-cancel-control="saved-maintenance"]');
      failControl=true;before=calls.filter(call=>call.type==='call_service').length;
      await click('[type="submit"]',card.tools.body);
      expect(calls.filter(call=>call.type==='call_service').length===before+1&&card.tools.body.textContent.includes('may already have been saved')&&data.inventory.operator_controls.length===2,'Ambiguous end-maintenance failure never auto-retries');
      failControl=false;listeners.get('disconnected')();await flush();
      expect(card.tools.body.querySelector('[type="submit"]').disabled,'Disconnected end-maintenance cannot submit');
      publish(data);await flush();
      let release;holdControl={promise:new Promise(resolve=>{release=resolve;})};before=calls.filter(call=>call.type==='call_service').length;
      card.tools.body.querySelector('[type="submit"]').click();card.tools.body.querySelector('[type="submit"]').click();await flush();
      expect(calls.filter(call=>call.type==='call_service').length===before+1,'Repeated end click sends one cancellation request');
      release();await flush();holdControl=null;
      expect(card.tools.body.textContent.includes('selected control has ended'),'Home Assistant confirms the selected window ended');
      expect(data.inventory.operator_controls.length===1&&data.inventory.operator_controls[0].control_id==='other-maintenance','Cancel removes exactly selected control and keeps overlapping window');
      expect(calls.filter(call=>call.type==='call_service').at(-1).service_data.control_id==='saved-maintenance','Cancellation targets the selected control id');
      await close();publish(data);await flush();await mqtt();
      expect(!root.querySelector('.config-detail [data-cancel-control="saved-maintenance"]')&&root.querySelector('.config-detail [data-cancel-control="other-maintenance"]'),'Reopened source reflects exact cancellation');
      await click('.config-detail [data-cancel-control="other-maintenance"]');
      data.inventory.operator_controls=[];publish(data);await flush();
      expect(card.tools.body.querySelector('[type="submit"]').disabled,'A window removed by expiry cannot be ended again');
      await close();expect(!root.querySelector('.config-detail [data-cancel-control]'),'Expired maintenance disappears after the inventory update');
      expect(!calls.some(call=>call.service==='start_maintenance'||call.service==='preview_maintenance'),'The household UI never requests new maintenance');
      recordResult(receipt,'sources.maintenance','pass','Integration details offer no new-maintenance entry, including expanded Details. Seeded two existing windows and checked visible reason/expiry plus directly reachable End maintenance. Closing confirmation made no mutation; ambiguous cancellation did not retry; disconnected and expired targets could not submit; duplicate clicks sent one cancellation. Reopened source retained only the overlapping window, and expiry publication removed that remaining control.');
    }catch(error){recordResult(receipt,'sources.maintenance','fail',error.message);await close();}finally{report();}
    const browsingMutations=calls.filter(call=>call.type==='call_service'||call.type==='homeostatic/save_settings').length;
    const rich=sourceDetailsFixture('device',['unavailable','unknown','72']);
    richDetails=rich.sourceDetail;data=rich.current.data;
    const disabled={...data.inventory.nodes.find(source=>source.node_id===DEVICE_ID),node_id:'device:disabled',name:'Disabled sensor',disabled:true,attributes:{integration:['lyric'],device:['disabled']}};
    data.inventory.nodes.push(disabled);data.inventory.catalog.candidates.push(disabled);data.devices.push({id:'disabled',name:'Disabled sensor'});
    publish(data);await flush();
    try{
      await click('[data-page="sources"]');
      if(card.sourcesMobileDetail&&root.querySelector('[data-action="back-sources"]'))await showTree();
      await click('[data-sources-select="source:entry:lyric"]');await showTree();
      const integrationToggle='[data-sources-toggle="source:entry:lyric"]';
      const selected=card.sourcesSelection;
      if(root.querySelector(integrationToggle).getAttribute('aria-expanded')==='true')await click(integrationToggle);
      expect(card.sourcesSelection===selected,'Collapsing a branch does not change selection');
      root.querySelector(integrationToggle).focus();root.querySelector(integrationToggle).dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));await flush();
      expect(root.querySelector(integrationToggle).getAttribute('aria-expanded')==='true'&&root.activeElement===root.querySelector(integrationToggle),'Right arrow expands and retains keyboard focus');
      root.querySelector(integrationToggle).dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowLeft',bubbles:true}));await flush();
      expect(root.querySelector(integrationToggle).getAttribute('aria-expanded')==='false'&&card.sourcesSelection===selected,'Left arrow collapses without selecting a different source');
      await click(integrationToggle);await click(`[data-sources-select="source:${DEVICE_ID}"]`);await showTree();
      await change('[data-sources-search]','sensor.3rd_floor_sensor_room_temperature');
      expect(root.querySelector(`[data-sources-select="source:${ENTITY_ID}"]`),'Entity-ID search finds the child source');
      expect(root.activeElement===root.querySelector('[data-sources-search]'),'Source search retains keyboard focus');
      await click(`[data-sources-select="source:${ENTITY_ID}"]`);
      expect(root.querySelector('#sources-detail-title').textContent.includes('Room temperature'),'Clicking searched source opens its identity');
      await showTree();await change('[data-sources-search]','no such source');
      expect(root.querySelector('.config-tree').textContent.includes('No matching sources'),'Empty search is explicit');
      await change('[data-sources-search]','');await change('[data-sources-group]','location');
      expect(card.sourcesSelection===`source:${ENTITY_ID}`,'Grouping preserves canonical selected source');
      await change('[data-sources-group]','integration');await change('[data-sources-search]','Disabled sensor');
      expect(!root.querySelector('[data-sources-select="source:device:disabled"]'),'Disabled source is excluded by default');
      await click('[data-sources-filters]');await change('[data-sources-disabled]',true);await click('[data-sources-filters]');
      await click('[data-sources-select="source:device:disabled"]');
      expect(root.querySelector('.source-body').textContent.includes('Monitoring paused while disabled'),'Disabled source explains monitoring status');
      await showTree();await click('[data-sources-filters]');await change('[data-sources-disabled]',false);await click('[data-sources-filters]');await change('[data-sources-search]','');
      await click('[data-action="collapse-sources"]');expect(root.querySelectorAll('[data-sources-toggle][aria-expanded="true"]').length===0,'Collapse groups closes branches');
      recordResult(receipt,'sources.tree','pass','Clicked integration/device/entity selections, collapse/expand and Collapse groups; dispatched ArrowLeft/Right on the focused rendered toggle; typed entity-ID and no-match searches, changed grouping and Show disabled. Verified independent selection, keyboard focus, retained canonical identity and disabled monitoring copy.');
    }catch(error){recordResult(receipt,'sources.tree','fail',error.message);throw error;}finally{report();}
    try{
      await change('[data-sources-search]','3rd Floor Sensor');await click(`[data-sources-select="source:${DEVICE_ID}"]`);
      expect(root.querySelector('.source-device-summary').textContent.includes('2 of 3 entities available'),'Device summary counts current available readings');
      const members=root.querySelector('.source-device-members');
      expect(members.textContent.includes('Unavailable'),'Current unavailable member is visible');
      expect(members.textContent.includes('Available · no value')&&members.textContent.includes('72'),'Member readings distinguish no-value and current numeric state');
      expect(!root.querySelector('.source-monitoring-explanation,.source-technical'),'Device keeps useful readings inline without a timestamp disclosure');
      const memberLink=root.querySelector('.source-device-members a[href*="/developer-tools/state"]');
      expect(memberLink?.getClientRects().length,'Device member links to its Home Assistant state');
      await showTree();await change('[data-sources-search]','sensor.3rd_floor_sensor_room_temperature');await click(`[data-sources-select="source:${ENTITY_ID}"]`);
      expect(root.querySelector('.source-identity').textContent.includes('3rd Floor Sensor'),'Member navigation retains parent device context');
      expect(root.querySelector('[data-source-policies="open"]')?.getClientRects().length&&!root.querySelector('.source-policy-links [data-definition-id]'),'Entity offers one contextual policy action');
      const native=root.querySelector('.source-native-navigation a[href*="/integrations/"]');expect(native?.getAttribute('href')==='/config/integrations/integration/lyric#config_entry=lyric','Named integration link uses its verified integration entry');
      let nativeHref=null;const intercept=event=>{const link=event.target.closest('a[href]');if(link){event.preventDefault();nativeHref=link.getAttribute('href');}};root.addEventListener('click',intercept);
      await click('.source-native-navigation a[href*="/integrations/"]');root.removeEventListener('click',intercept);expect(nativeHref==='/config/integrations/integration/lyric#config_entry=lyric','Rendered named link requests the expected mocked integration destination');
      expect(!root.querySelector('.source-heading').textContent.includes('Homeostatic updated'),'Technical timestamps do not crowd the source heading');
      expect(!root.querySelector('.source-technical,.source-monitoring-explanation'),'Entity details omit technical metadata and collapsed sections');
      await click('[data-source-policies="open"]');
      expect(root.querySelector('.source-policy-dialog')?.open&&root.querySelectorAll('.source-policy-dialog [data-definition-id]').length===2,'Contextual dialog lists both contributing policies');
      await click('.source-policy-dialog [data-definition-action="open-policy"][data-definition-id="entities"]');
      expect(root.querySelector('.unified-policy-editor h1')?.textContent==='Entities','Policy link opens the exact contributing policy editor');
      await click('[data-page="sources"]');expect(root.querySelector('#sources-detail-title').textContent.includes('Room temperature'),'Returning from policy keeps source context');
      expect(calls.filter(call=>call.type==='call_service'||call.type==='homeostatic/save_settings').length===browsingMutations,'Read-only source and policy navigation preserves saved state');
      recordResult(receipt,'sources.details','pass','Clicked current device member readings, shared Details and other readings, entity member, named integration link (intercepted in this isolated fixture), Monitoring policies dialog and Monitoring return. Verified unavailable/no-value/numeric distinctions, both contributing policies in context, no entity technical/disclosure blocks, exact policy editor and no configuration mutation. Retry reading and issue navigation were exercised in sources.history.');
    }catch(error){recordResult(receipt,'sources.details','fail',error.message);throw error;}finally{report();}
    const checked=receipt.results.filter(item=>item.status!=='untested');feedback.textContent=checked.map(item=>`${item.status.toUpperCase()}: ${item.id}`).join(' · ');
  }catch(error){if(receipt.results.find(item=>item.id==='sources.history').status==='untested')recordResult(receipt,'sources.history','fail',error.message);feedback.textContent='FAIL: '+error.stack;}finally{document.querySelector('#run').disabled=false;report();}
};
if(new URLSearchParams(location.search).has('run'))document.querySelector('#run').click();
</script></body></html>
