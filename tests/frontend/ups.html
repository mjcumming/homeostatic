<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UPS monitoring · isolated UI test</title>
<style>:root{--primary-text-color:#182a34;--primary-background-color:#f5f7f8;--card-background-color:#fff;--secondary-background-color:#edf2f5;--secondary-text-color:#546875;--divider-color:#dce4e9;--primary-color:#007eab;--text-primary-color:#fff}body{margin:0;font:14px Arial,sans-serif;background:var(--primary-background-color)}#controls{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{font:inherit;padding:8px}homeostatic-card{display:block;max-width:1100px;margin:auto}#feedback{white-space:pre-wrap}</style></head>
<body><div id="controls"><strong>Synthetic UPS signals · no live services</strong><button id="backup">Backup power</button><button id="mains">Mains restored</button><button id="policy">Reserve policy</button><button id="issues">Issues</button><label><input id="phone" type="checkbox">Phone layout</label><button id="run">Run UPS scenario</button><span id="feedback" role="status"></span></div><homeostatic-card></homeostatic-card>
<script type="module">
import "../../custom_components/homeostatic/frontend/homeostatic.js";
import {monitoringExample} from "./monitoring-fixture.mjs";
import {emptyNotificationDefinitions,newMonitoringPolicy} from "../../custom_components/homeostatic/frontend/reusable-editors.mjs";
const card=document.querySelector("homeostatic-card"),data=monitoringExample(),feedback=document.querySelector("#feedback");
const definitions=emptyNotificationDefinitions("America/Chicago");
definitions.methods.phone={name:"Owner's phone",mode:"fixed",destinations:["phone:owner"]};
const reserve={...newMonitoringPolicy([],"ups_reserve"),id:"reserve",name:"Office UPS reserve",enabled:true,parameters:{charge_low:10,charge_clear:20},notifications:[{id:"mains",when:"mains",schedule:"morning",methods:["phone"]},{id:"backup",when:"backup",schedule:"acknowledge",methods:["phone"]}]};
const sources=["ups_power","ups_reserve"].map(check=>({node_id:check,name:`Office UPS · ${check==="ups_power"?"Backup power":"Low reserve"}`,kind:"ups",check_id:check,ups_name:"Office UPS",ups_platform:"nut",ups_entities:[["status","sensor.office_status"],["charge","sensor.office_charge"],["runtime","sensor.office_runtime"]],attributes:{kind:["ups"],device:["office"],integration_domain:["nut"]},watched:true,disabled:false,requirements:[],attached_by:["reserve"],excluded_by:[],monitoring_policy:check==="ups_reserve"?"reserve":"power"}));
const episodes=sources.map(source=>({episode_id:`issue:${source.node_id}`,anchor:source.node_id,form:"root",status:"warn",importance:"normal",reasons:[],recorded:[source.node_id],impact:[source.node_id],labels:{},annotations:{},opened_at:"2026-10-13T12:00:00Z",updated_at:"2026-10-13T12:00:00Z",due_at:null}));
data.inventory.nodes=sources;data.inventory.catalog.candidates=sources;data.devices=[{id:"office",name:"Office UPS"}];data.functions=[];data.inventory.operator_controls=[];data.inventory.attention_controls_supported=true;data.inventory.notification_requests=[];
const settings={monitoring_policies:[reserve],notification_definitions:definitions,timings:{},notifications:false,consumer:null,policy:{timezone:"America/Chicago",recipients:{},rules:[]},reporting:null,simple_notifications:null};
card._hass={user:{is_admin:true},states:{},localize(){return null;},async callWS(request){
  if(request.type==="homeostatic/configuration")return card.configuration;
  if(request.type==="homeostatic/node") {
    const source=sources.find(item=>item.node_id===request.node_id),observation=data.inventory.ups_status[request.node_id];
    return {source,explanation:{node_id:source.node_id,own:"warn",nodes:[],findings:[],muted_by:[],checks:[],episodes:[]},readiness:{answer:"degraded",nodes:[]},impact:{nodes:[]},entity_status:{current:{reason:observation.reason,message:observation.message,observed_at:observation.observed_at},ups:observation}};
  }
  throw Error("Unexpected request in isolated UPS fixture: "+request.type);
}};
card.current={status:"current",data};card.configuration={revision:"fixture",rules:[],settings,areas:[],floors:[],labels:[],notification_people:[],delivery_targets:[]};card.configDraft=[];card.settingsDraft=structuredClone(settings);card.page="problems";
function mode(backup) {
  data.inventory.episodes=backup?episodes:[episodes[1]];
  data.inventory.ups_status=Object.fromEntries(sources.map(source=>[source.node_id,{status:source.check_id==="ups_power"&&!backup?"pass":"warn",reason:source.check_id==="ups_power"?(backup?"ups_on_battery":"ups_on_mains"):(backup?"ups_reserve_critical":"ups_reserve_low"),message:source.check_id==="ups_power"?(backup?"Running on backup power":"Mains power reported"):(backup?"Low reserve on backup power":"Mains restored; reserve still low"),observed_at:"2026-10-13T12:00:00Z",evidence:{power_mode:backup?"backup":"mains",readings:{charge:8,runtime:3}}}]));
  data.policy={episodes:data.inventory.episodes.map(episode=>({episode_id:episode.episode_id,loudness:backup?"urgent":"digest",recipients:[],acknowledgment:null}))};
  card.render();
}
mode(true);
document.querySelector("#backup").onclick=()=>mode(true);
document.querySelector("#mains").onclick=()=>mode(false);
document.querySelector("#policy").onclick=()=>{card.page="policies";card.definitionSelection={kind:"policies",id:"reserve"};card.render();};
document.querySelector("#issues").onclick=()=>{card.page="problems";card.render();};
document.querySelector("#phone").onchange=event=>{card.style.width=event.target.checked?"390px":"";};
document.querySelector("#run").onclick=()=>{
  try {
    card.page="problems";mode(true);
    const root=card.shadowRoot,expect=(value,message)=>{if(!value)throw Error(message);};
    expect(root.querySelectorAll(".ups-issue-group").length===1,"UPS equipment must be grouped");
    expect(root.querySelector(".ups-issue-group strong").textContent.includes("Low reserve"),"Urgent reserve must lead");
    const details=root.querySelector(".ups-issue-group details");details.open=true;
    mode(false);
    expect(root.querySelector(".ups-issue-group details").open,"Live updates must retain disclosure");
    expect(root.textContent.includes("Mains restored; reserve still low"),"Partial recovery must remain visible");
    card.page="policies";card.definitionSelection={kind:"policies",id:"reserve"};card.render();
    expect(root.querySelectorAll('[data-row-field="when"]').length===2,"Both reserve modes must be visible");
    expect(root.querySelector('[data-definition-field="parameters:charge_clear"]'),"Recovery threshold must be editable");
    expect(root.querySelector(".definition-editor").scrollWidth<=root.querySelector(".definition-editor").clientWidth+1,"Editor must fit its viewport");
    feedback.textContent="PASS: grouped issues, urgent reserve, partial recovery, retained disclosure and both mode schedules.";
  }catch(error){feedback.textContent="FAIL: "+error.message;}
};
window.addEventListener("error",event=>{feedback.textContent="ERROR: "+event.message;});
</script></body></html>
