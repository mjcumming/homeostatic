<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Homeostatic workflow validation</title>
<style>:root{--primary-text-color:#182a34;--primary-background-color:#f5f7f8;--card-background-color:#fff;--secondary-background-color:#edf2f5;--secondary-text-color:#546875;--divider-color:#dce4e9;--primary-color:#007eab;--text-primary-color:#fff}body{margin:0;font:14px Arial,sans-serif;background:var(--primary-background-color)}#controls{padding:12px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--divider-color)}button{font:inherit;padding:8px}homeostatic-panel{display:block;max-width:1300px;margin:auto}#feedback{white-space:pre-wrap}</style></head>
<body><div id="controls"><strong>Synthetic editor scenario · no live services</strong><button id="run">Run workflow checks</button><label><input type="checkbox" id="narrow">Phone layout</label><label><input type="checkbox" id="dark">Dark theme</label><span id="feedback" role="status"></span></div><homeostatic-panel></homeostatic-panel>
<script type="module">
import "../../custom_components/homeostatic/frontend/homeostatic.js";
import {emptyNotificationDefinitions,newMonitoringPolicy} from "../../custom_components/homeostatic/frontend/reusable-editors.mjs";
import {monitoringExample} from "./monitoring-fixture.mjs";
const card=document.querySelector("homeostatic-panel"),feedback=document.querySelector("#feedback"),data=monitoringExample();
const definitions=emptyNotificationDefinitions("America/Chicago");
definitions.methods.phone={name:"Owner phone",mode:"fixed",destinations:["phone:owner"]};
definitions.methods.email={name:"Household email",mode:"fixed",destinations:["notify:email"]};
definitions.default=[{id:"default",timing:{mode:"report",at:"08:00",weekdays:[0,1,2,3,4,5,6]},methods:["phone"]}];
const policy={...newMonitoringPolicy([],"thermostat"),name:"Main floor thermostat",enabled:true,match:{kind:["entity"],entity:["climate.main_floor"]},notifications:[{id:"immediate",timing:{mode:"immediate"},methods:["phone"]},{id:"report",timing:{mode:"report",at:"08:00",weekdays:[0,1,2,3,4,5,6]},methods:["email"]}]};
let saved={monitoring_policies:[policy],notification_definitions:definitions,timings:{settle:120,unknown_hold:900,retry_hold:120,clear_hold:120,rejoin_grace:60,startup_grace:120,startup_quiet_max:600,coalesce_count:3,coalesce_window:60,batch:30},notifications:false,consumer:null};
let revision=1,proposal=null;
const calls=[];
for(let n=0;n<23;n++)data.inventory.episodes.push({episode_id:`device-issue-${n}`,anchor:`device:camera-${n}`,opened_at:"2026-10-14T12:00:00Z",importance:"normal",recorded:[`device:camera-${n}`],reasons:[{node_id:`device:camera-${n}`,check_id:"availability",status:"fail",reason:"unavailable",message:"A monitored entity is unavailable"}],impact:[]});
data.inventory.resolved_history={episodes:[],retention:{max_episodes:100,max_age_days:30},started_at:"2026-10-14T12:00:00Z"};
data.policy.reports=[{name:"entry:policy_policy-1_report",next_at:"2026-10-15T13:00:00Z"}];
const configuration=()=>({revision:String(revision),settings:structuredClone(saved),notification_people:[{id:"person.owner",entity_id:"person.owner",name:"Owner"},{id:"person.guest",entity_id:"person.guest",name:"Guest"}],delivery_targets:[{channel:"phone:owner",name:"Owner phone",type:"App",available:true},{channel:"notify:email",name:"Household email",type:"Email",available:true},{channel:"satellite:kitchen",name:"Kitchen assistant",type:"Voice",available:true},{channel:"tts:provider:living-room",name:"Living room speaker",type:"Voice",available:true},{channel:"sms:family:",name:"Family SMS",type:"SMS",requires_target:true,available:true}],monitoring_policy_templates:[{...newMonitoringPolicy([],"battery"),id:"default_batteries"}],areas:[{id:"kitchen",name:"Kitchen",floor_id:"main"},{id:"family",name:"Family room",floor_id:"main"},{id:"bedroom",name:"Bedroom",floor_id:"upper"}],labels:[{id:"phones",name:"Phones"}],floors:[{id:"main",name:"Main floor"},{id:"upper",name:"Upstairs"}]});
card._hass={user:{is_admin:true},config:{time_zone:"America/Chicago"},localize:()=>null,async callWS(request){
  calls.push(structuredClone(request));
  if(request.type==="homeostatic/configuration")return configuration();
  if(request.type==="homeostatic/preview_delivery_method")return {method_id:request.method_id,name:"Synthetic saved method",targets:[{channel:"phone:owner",name:"Owner phone",type:"App",available:true}],presence:{"person.owner":{state:"not_home",restored:false}},skipped:false,preview_token:"synthetic-targets"};
  if(request.type==="homeostatic/test_delivery_method"){
    if(request.preview_token!=="synthetic-targets")throw Error("A target preview is required");
    return {requested:["phone:owner"],failed:[],skipped:false};
  }
  if(request.type==="homeostatic/preview_settings"){
    proposal=structuredClone(request.settings);
    return {before:structuredClone(saved),after:proposal,preview_token:"exact-draft",open_problems:2,requests_now:0,monitoring:{watched:3,added:[],removed:[],added_count:0,removed_count:0,functions:[],ended_issues:["old-policy-issue"]}};
  }
  if(request.type==="homeostatic/save_settings"){
    if(request.revision!==String(revision))throw Error("Stale settings");
    saved=structuredClone(request.settings);delete saved.rules;revision++;return {saved:true};
  }
  throw Error("Unexpected request in isolated fixture: "+request.type);
}};
card.current={status:"current",data};card.page="problems";card.configuration=configuration();card.settingsDraft=structuredClone(saved);card.render();
document.querySelector("#narrow").onchange=event=>{card.style.width=event.target.checked?"390px":"";};
document.querySelector("#dark").onchange=event=>{document.documentElement.style.cssText=event.target.checked?"--primary-text-color:#e8ecef;--primary-background-color:#10181e;--card-background-color:#19242b;--secondary-background-color:#283740;--secondary-text-color:#b0bfc9;--divider-color:#3e4c56;--primary-color:#4abde5;--text-primary-color:#102530":"";};
window.addEventListener("error",event=>{feedback.textContent="ERROR: "+event.message;});
document.querySelector("#run").onclick=async()=>{
 const root=card.shadowRoot,check=(value,message)=>{if(!value)throw Error(message);};
 const click=selector=>{const target=root.querySelector(selector);check(target,"Missing "+selector);target.click();};
 const input=(selector,value)=>{const target=root.querySelector(selector);check(target,"Missing "+selector);target.value=value;target.dispatchEvent(new Event("input",{bubbles:true,composed:true}));};
 const change=(selector,value)=>{const target=root.querySelector(selector);check(target,"Missing "+selector);if(target.type==="checkbox")target.checked=value;else target.value=value;target.dispatchEvent(new Event("change",{bubbles:true,composed:true}));};
 const settle=async()=>{for(let n=0;n<10;n++)await new Promise(resolve=>setTimeout(resolve,20));};
 try {
  card.page="problems";card.render();
  check(!root.querySelector('[data-page="overview"]'),"Overview removed from navigation");
  click('[data-page="policies"]');click('[data-definition-action="edit"][data-definition-id="policy-1"]');
  check(!root.querySelector('[data-definition-action="save-scoped"]'),"Clean policy has no save actions");
  check(root.querySelectorAll("main h1").length===1,"Editor has one page title");
  check([...root.querySelectorAll("[data-workspace-return],.editor-back")].filter(button=>button.getBoundingClientRect().width>0).length===1,"Editor has one visible return route");
  input('[data-definition-field="name"][data-definition-id="policy-1"]',"Changed thermostat");
  check(root.querySelector('[data-definition-action="save-scoped"]'),"Dirty policy has Save policy");
  change('[data-notifications-switch]',true);await settle();
  check(saved.notifications===true,"Global notifications saved");
  check(saved.monitoring_policies[0].name==="Main floor thermostat","Global switch did not save policy draft");
  check(card.settingsDraft.monitoring_policies[0].name==="Changed thermostat","Policy draft retained");
  change('[data-notifications-switch]',false);await settle();
  click('[data-definition-action="save-scoped"]');await settle();
  check(saved.monitoring_policies[0].name==="Changed thermostat","Policy saved");
  check(!root.querySelector('[data-definition-action="save-scoped"]'),"Save actions disappear after save");
  input('[data-definition-field="name"][data-definition-id="policy-1"]',"Discard me");
  click('[data-definition-action="discard-scoped"]');
  check(card.settingsDraft.monitoring_policies[0].name==="Changed thermostat","Discard restores saved policy");
  click('[data-page="notifications"]');
  click('[data-definition-action="notification-view"][data-definition-kind="methods"]');
  click('[data-definition-action="edit"][data-definition-kind="methods"][data-definition-id="phone"]');
  input('[data-definition-field="name"][data-definition-id="phone"]',"Renamed phone");
  click('[data-definition-action="save-scoped"]');await settle();
  check(saved.notification_definitions.methods.phone.name==="Renamed phone","Standalone method saved");
  check(!root.querySelector('[data-definition-action="save-scoped"]'),"Method clean after save");
  check(!calls.some(call=>call.type==="homeostatic/test_delivery_method"),"No test notification requested");
  feedback.textContent="PASS: clean and dirty editors, policy save and discard, global switch isolation, retained drafts, standalone method save; no notification requests.";
 }catch(error){feedback.textContent="FAIL: "+error.message;throw error;}
};

if(new URLSearchParams(location.search).has("battery-picker")) {
  const battery={node_id:"battery:registry:owner-phone",name:"Owner phone",kind:"battery",entity_id:"sensor.owner_phone_battery",
    attributes:{kind:["battery"],entity:["registry:owner-phone"]},watched:false,attached_by:[],requirements:[]};
  const complete={...structuredClone(data),schema_version:3,catalog_loaded:true,inventory:{...structuredClone(data.inventory),nodes:[],catalog:{candidates:[battery]}}};
  saved.monitoring_policies=[{...newMonitoringPolicy([],"battery"),enabled:true,excluded_sources:[]}];
  card.configuration=configuration();card.settingsDraft=structuredClone(saved);
  card.scopedConfiguration=null;card.page="policies";card.definitionSelection={kind:"policies",id:"policy-1"};
  card.policyPicker={id:"policy-1",query:"Batt",selectedOnly:false};
  let requested=false;
  card.store={ensureCatalog(){requested=true;return Promise.resolve();}};
  const finish=document.createElement("button");
  finish.type="button";finish.textContent="Finish loading available sources";document.querySelector("#controls").append(finish);
  const show=loaded=>{
    card.current={status:"current",data:loaded?structuredClone(complete):{...structuredClone(complete),catalog_loaded:false,inventory:{...structuredClone(complete.inventory),catalog:{candidates:[]}}}};
    card.render();
  };
  finish.onclick=()=>show(true);
  document.querySelector("#run").textContent="Run battery picker checks";
  document.querySelector("#run").onclick=()=>{
    try {
      show(false);
      const root=card.shadowRoot,before=JSON.stringify(saved),check=(value,message)=>{if(!value)throw Error(message);};
      check(requested,"Policies requests the catalog");
      check(root.textContent.includes("Loading available sources"),"Loading is explicit");
      check(!root.textContent.includes("No matching choices"),"Loading is not an empty search");
      finish.click();
      const choice=root.querySelector('[data-definition-value="battery:registry:owner-phone"]');
      check(choice,"Batt finds sensor.owner_phone_battery when its name is Owner phone");
      check(card.policyPicker.query==="Batt","The search survives arrival");
      choice.checked=true;choice.dispatchEvent(new Event("change",{bubbles:true,composed:true}));
      check(card.settingsDraft.monitoring_policies[0].excluded_sources.includes("battery:registry:owner-phone"),"Exclusion stays a local draft");
      check(JSON.stringify(saved)===before,"Saved policy unchanged");
      check(!calls.some(call=>call.type==="homeostatic/save_settings"||call.type==="homeostatic/test_delivery_method"),"No save or service request");
      feedback.textContent="PASS: direct Policies loading, entity-ID search, retained selection and local exclusion; no saved changes.";
    }catch(error){feedback.textContent="FAIL: "+error.message;throw error;}
  };
  show(false);
}
</script></body></html>
